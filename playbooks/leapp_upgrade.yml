---
- name: Upgrade OS to next Major version (leapp)
  hosts: "{{ edpm_override_hosts | default('all', true) }}"
  strategy: linear
  gather_facts: "{{ gather_facts | default(false) }}"
  any_errors_fatal: "{{ edpm_any_errors_fatal | default(true) }}"
  max_fail_percentage: "{{ edpm_max_fail_percentage | default(0) }}"
  environment: "{{ edpm_playbook_environment | default({}) }}"
  force_handlers: true
  tasks:
    # The min subset carries the facts infra.leapp snapshots into
    # /etc/ansible/facts.d/pre_ipu.fact before the upgrade (selinux, cmdline,
    # local); missing facts degrade post-upgrade validation and SELinux
    # restoration. The upstream roles gather anything else they need.
    - name: Gather facts required by the leapp upgrade roles
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "min"

    - name: Import leapp upgrade role
      ansible.builtin.import_role:
        name: osp.edpm.edpm_leapp_upgrade
      tags:
        - edpm_leapp_upgrade
