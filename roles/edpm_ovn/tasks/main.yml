- name: Validate bridge mappings type
  ansible.builtin.assert:
    that:
      - (edpm_ovn_bridge_mappings is string) or (edpm_ovn_bridge_mappings | type_debug == 'list')
    fail_msg: edpm_ovn_bridge_mappings must be a string or a list of bridge mapping strings.

- name: Include host prep tasks
  ansible.builtin.import_tasks: install.yml

- name: Include bootstrap tasks
  ansible.builtin.import_tasks: bootstrap.yml

- name: Configure firewall rules
  ansible.builtin.import_tasks: firewall.yml

- name: Configure OVS
  ansible.builtin.import_tasks: configure.yml

- name: Ensure ovn_controller is running
  ansible.builtin.import_tasks: run.yml

- name: Cleanup unwanted OVS keys
  ansible.builtin.import_tasks: cleanup.yml
