- name: Set OVN role path for quadlet templates
  ansible.builtin.set_fact:
    _edpm_ovn_role_path: "{{ role_path }}"

- name: Set cacert mount if present
  block:
    - name: Determine if cacert file exists
      ansible.builtin.stat:
        path: "{{ edpm_ovn_controller_tls_cacert_bundle_src }}"
      register: cacert_bundle_exists

    - name: Set ca_cert mount
      ansible.builtin.set_fact:
        edpm_ovn_controller_tls_cacert_volumes:
          - "{{ edpm_ovn_controller_tls_cacert_bundle_src }}:{{ edpm_ovn_controller_tls_cacert_bundle_dest }}:ro,z"
      when: cacert_bundle_exists.stat.exists

- name: Update ovn_controller health check script
  ansible.builtin.include_tasks:
    file: healthchecks.yml

- name: Gather service facts to check for FRR
  ansible.builtin.service_facts:

- name: Remove FRR-OVN BindsTo drop-ins
  become: true
  when: >-
    not (edpm_frr_ovn_bind | default(true)) or
    ansible_facts['services']['edpm_frr.service']['status']
    | default('not-found')
    not in ['enabled', 'disabled', 'static', 'indirect', 'generated']
  block:
    - name: Remove FRR BindsTo drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/edpm_frr.service.d/ovn-bind.conf
        state: absent
      register: _frr_dropin_removed

    - name: Remove OVN BindsTo drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/edpm_ovn_controller.service.d/frr-bind.conf
        state: absent
      register: _ovn_dropin_removed

    - name: Reload systemd after removing drop-ins
      ansible.builtin.systemd:
        daemon_reload: true
      when: _frr_dropin_removed.changed or _ovn_dropin_removed.changed

# TODO(quadlet-migration): Remove use_quadlet flag once all services are migrated.
- name: Run ovn_controller container
  ansible.builtin.include_role:
    name: osp.edpm.edpm_container_standalone
  vars:
    edpm_container_standalone_use_quadlet: true
    edpm_container_standalone_service: ovn_controller
    edpm_service_name: "{{ edpm_ovn_service_name }}"
    edpm_container_standalone_quadlet_defs:
      ovn_controller: "{{ _edpm_ovn_role_path }}/templates/quadlet/ovn_controller.container.j2"

- name: Create FRR-OVN BindsTo drop-ins when peer is present
  become: true
  when:
    - edpm_frr_ovn_bind | default(true)
    - >-
      ansible_facts['services']['edpm_frr.service']['status']
      | default('not-found')
      in ['enabled', 'disabled', 'static', 'indirect', 'generated']
  block:
    - name: Create FRR service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/edpm_frr.service.d
        state: directory
        mode: "0755"

    - name: Create FRR BindsTo OVN drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/edpm_frr.service.d/ovn-bind.conf
        mode: "0644"
        content: |
          [Unit]
          BindsTo=edpm_ovn_controller.service

    - name: Create OVN controller service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/edpm_ovn_controller.service.d
        state: directory
        mode: "0755"

    - name: Create OVN BindsTo FRR drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/edpm_ovn_controller.service.d/frr-bind.conf
        mode: "0644"
        content: |
          [Unit]
          BindsTo=edpm_frr.service

    - name: Reload systemd to activate BindsTo drop-ins
      ansible.builtin.systemd:
        daemon_reload: true
