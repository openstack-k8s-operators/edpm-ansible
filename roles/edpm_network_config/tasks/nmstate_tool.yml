# Network configuration using nmstate as the primary tool (via linux-system-roles)
# This is for edpm_network_config_tool: 'nmstate' (not os-net-config with nmstate provider)

- name: Configure NetworkManager for nmstate
  ansible.builtin.include_tasks: nm_config.yml
  vars:
    # For nmstate, always enable NetworkManager DNS management
    edpm_bootstrap_network_resolvconf_update: true

- name: Set NIC mapping file path for nmstate path (internal, not user-overridable)
  ansible.builtin.set_fact:
    edpm_network_config_mapping_file: /var/lib/edpm-config/template_nic_mapping.yaml

- name: Ensure /var/lib/edpm-config exists
  become: true
  ansible.builtin.file:
    path: /var/lib/edpm-config
    state: directory
    mode: "0755"

- name: Create EDPM NIC mapping file (nmstate path)
  become: true
  ansible.builtin.import_tasks: nic_mapping.yml

# Check mode: derived NIC mapping is not produced here, and the derived-file slurp is skipped later for the same reason.
- name: Copy user NIC mapping to derived input and run mapped_nics
  become: true
  when: not ansible_check_mode | bool

  block:
    - name: Stat user NIC mapping file
      ansible.builtin.stat:
        path: "{{ edpm_network_config_mapping_file }}"
      register: edpm_user_nic_mapping_stat

    - name: Copy user_nic_mapping.yaml to derived_nic_mapping.yaml
      ansible.builtin.copy:
        src: "{{ edpm_network_config_mapping_file }}"
        dest: "{{ edpm_network_config_derived_nic_mapping_file }}"
        remote_src: true
        force: true
        mode: "0644"
      when: edpm_user_nic_mapping_stat.stat.exists | default(false)

    - name: Remove stale derived NIC mapping when template mapping file is absent
      ansible.builtin.file:
        path: "{{ edpm_network_config_derived_nic_mapping_file }}"
        state: absent
      when: not (edpm_user_nic_mapping_stat.stat.exists | default(false))

    - name: Check that Python3 can import yaml (requires python3-pyyaml on the node)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import yaml"
      register: edpm_derived_nic_mapping_pyyaml_check
      changed_when: false
      failed_when: false

    - name: Fail when PyYAML is not available for derived NIC mapping
      ansible.builtin.fail:
        msg: >-
          edpm_derived_nic_mapping.py needs PyYAML. Install the OS package that provides
          it (on RHEL-like systems: python3-pyyaml), e.g. ensure
          edpm_network_config_systemrole_nmstate_dependencies includes python3-pyyaml
          and package installation ran (see role tasks/package_management.yml).
      when: edpm_derived_nic_mapping_pyyaml_check.rc | int != 0

    - name: Run derived NIC mapping (edpm_derived_nic_mapping.py)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ role_path }}/files/edpm_derived_nic_mapping.py"
          - "-f"
          - "{{ edpm_network_config_derived_nic_mapping_file }}"
      register: edpm_derived_nic_mapping_result
      changed_when: >-
        'edpm_derived_nic_mapping_changed=yes' in (edpm_derived_nic_mapping_result.stdout | default(''))

- name: Check nmstate return code for conditional logic
  become: true
  block:
    - name: Check if nmstate return code file exists
      ansible.builtin.stat:
        path: /var/lib/edpm-config/nmstate.returncode
      register: nmstate_returncode_stat

    - name: Read nmstate return code file if it exists
      ansible.builtin.slurp:
        path: /var/lib/edpm-config/nmstate.returncode
      register: nmstate_returncode_slurp
      when: nmstate_returncode_stat.stat.exists

- name: Validate and bind PCI drivers before applying network state
  ansible.builtin.include_tasks: driver_bind.yml
  when: edpm_network_config_driver_bind | trim | length > 0

- name: Configure network with network role from system roles [nmstate]
  become: true
  # The conditions here are when we want to apply the NetworkConfig:
  # - If edpm_network_config_update is True
  # - Or the previous run of NetworkConfig failed
  # - Or it has never run
  # This matches the prior behavior of when a Heat SoftwareDeployment was used
  when:
    - (edpm_network_config_update) or
      (nmstate_returncode_stat.stat.exists and
      ((nmstate_returncode_slurp.content | b64decode | int) != 0)) or
      (not nmstate_returncode_stat.stat.exists)
  block:
    - name: Create EDPM NIC mapping file (nmstate path)
      ansible.builtin.import_tasks: nic_mapping.yml

    - name: Fail when no nmstate template is defined for apply
      ansible.builtin.fail:
        msg: >-
          Set edpm_network_config_template and/or
          edpm_network_config_nmstate_sriov_pf_template (non-empty YAML strings).
      when:
        - edpm_network_config_nmstate_sriov_pf_template | trim | length == 0
        - edpm_network_config_template | trim | length == 0

    - name: Ensure /var/lib/edpm-config exists
      ansible.builtin.file:
        path: /var/lib/edpm-config
        state: directory
        mode: "0755"

    - name: Stat derived NIC mapping file for nmstate template substitution
      ansible.builtin.stat:
        path: "{{ edpm_network_config_derived_nic_mapping_file }}"
      register: edpm_derived_nic_mapping_file_stat

    - name: Read derived NIC mapping for nmstate template substitution
      ansible.builtin.slurp:
        path: "{{ edpm_network_config_derived_nic_mapping_file }}"
      register: edpm_derived_nic_mapping_for_template
      when:
        - not ansible_check_mode | bool
        - edpm_derived_nic_mapping_file_stat.stat.exists | default(false)

    - name: Build interface_mapping dict from derived file
      ansible.builtin.set_fact:
        edpm_derived_interface_mapping: >-
          {{
            (edpm_derived_nic_mapping_for_template.content | b64decode | from_yaml | default({})).get('interface_mapping', {})
            if edpm_derived_nic_mapping_for_template is defined
            and edpm_derived_nic_mapping_for_template.content is defined
            else {}
          }}

    - name: Apply nmstate phase 1 (SR-IOV on PF)
      when: edpm_network_config_nmstate_sriov_pf_template | trim | length > 0
      block:
        - name: Apply nmstate SR-IOV phase
          ansible.builtin.include_tasks: nmstate_apply_state.yml
          vars:
            edpm_nmstate_apply_template: "{{ edpm_network_config_nmstate_sriov_pf_template }}"
            edpm_nmstate_apply_phase: sriov
            edpm_nmstate_apply_interface_mapping: "{{ edpm_derived_interface_mapping | default({}) }}"

        - name: Record SR-IOV phase result
          ansible.builtin.set_fact:
            nmstate_sriov_result: "{{ edpm_nmstate_apply_result }}"

        - name: Fail when nmstate SR-IOV phase failed
          ansible.builtin.fail:
            msg: "nmstate SR-IOV phase (edpm_network_config_nmstate_sriov_pf_template) failed."
          when: nmstate_sriov_result.failed | default(false)

        - name: Wait for SR-IOV VFs after phase 1
          when: edpm_network_config_nmstate_sriov_vf_wait | bool
          block:
            - name: Parse phase-1 state for VF wait (same NIC alias substitution as the SR-IOV apply)
              ansible.builtin.set_fact:
                edpm_nmstate_sriov_phase_state: >-
                  {{
                    edpm_network_config_nmstate_sriov_pf_template
                    | from_yaml
                    | edpm_substitute_nic_aliases(edpm_derived_interface_mapping | default({}))
                  }}

            - name: Wait until sysfs reports expected SR-IOV VF counts
              ansible.builtin.include_tasks: nmstate_wait_sriov_vfs.yml

    - name: Apply nmstate phase 2 (main network template)
      when: edpm_network_config_template | trim | length > 0
      block:
        - name: Apply nmstate main phase
          ansible.builtin.include_tasks: nmstate_apply_state.yml
          vars:
            edpm_nmstate_apply_template: "{{ edpm_network_config_template }}"
            edpm_nmstate_apply_phase: main
            edpm_nmstate_apply_interface_mapping: "{{ edpm_derived_interface_mapping | default({}) }}"

        - name: Record main nmstate phase result
          ansible.builtin.set_fact:
            nmstate_result: "{{ edpm_nmstate_apply_result }}"

        - name: Fail when nmstate main phase failed
          ansible.builtin.fail:
            msg: "nmstate main phase (edpm_network_config_template) failed."
          when: nmstate_result.failed | default(false)

    - name: Set nmstate_result when only SR-IOV phase ran
      ansible.builtin.set_fact:
        nmstate_result: "{{ nmstate_sriov_result }}"
      when:
        - nmstate_sriov_result is defined
        - nmstate_result is not defined

    - name: Write rc of nmstate run
      ansible.builtin.copy:
        content: >-
          {{
            '1' if (
              (nmstate_sriov_result.failed | default(false))
              or (nmstate_result.failed | default(false))
            ) else '0'
          }}
        dest: /var/lib/edpm-config/nmstate.returncode
        mode: "0644"

    - name: Refresh nmstate device_map (physical device PCI/driver identity)
      ansible.builtin.include_tasks: nmstate_device_map.yml

  rescue:
    - name: Ensure /var/lib/edpm-config exists after nmstate failure
      ansible.builtin.file:
        path: /var/lib/edpm-config
        state: directory
        mode: "0755"

    - name: Write failure rc of nmstate run
      ansible.builtin.copy:
        content: "1"
        dest: /var/lib/edpm-config/nmstate.returncode
        mode: "0644"

    - name: Re-raise nmstate apply failure
      ansible.builtin.fail:
        msg: "nmstate network configuration failed; see tasks above."

    - name: Refresh nmstate device_map (physical device PCI/driver identity)
      ansible.builtin.include_tasks: nmstate_device_map.yml
