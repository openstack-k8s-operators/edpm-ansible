---
# Build/refresh a device_map.yaml recording, for every physical network
# device (PCI ethernet NIC, SR-IOV VF, ...), its current PCI address, MAC
# address, and bound kernel driver. Observational only (no skip policy).
# The helper merges prior entries whose netdev left sysfs but whose PCI BDF
# is still bound to vfio-pci, so derived NIC mapping can keep those aliases
# stable across subsequent runs.

- name: Ensure /var/lib/edpm-config exists
  ansible.builtin.file:
    path: /var/lib/edpm-config
    state: directory
    mode: "0755"

- name: Install nmstate device_map helper script
  ansible.builtin.copy:
    src: edpm_nmstate_device_map.py
    dest: /var/lib/edpm-config/edpm_nmstate_device_map.py
    mode: "0644"

- name: Generate nmstate device_map
  ansible.builtin.command:
    argv:
      - python3
      - /var/lib/edpm-config/edpm_nmstate_device_map.py
      - -o
      - "{{ edpm_network_config_nmstate_device_map_file }}"
  changed_when: false
