---
# Apply one nmstate desired-state document via linux_system_roles.network.
# Caller sets edpm_nmstate_apply_template (YAML string) and edpm_nmstate_apply_phase (label for logs).
# Caller may set edpm_nmstate_apply_interface_mapping (dict of nicN -> real name) to substitute
# NIC aliases before applying.
#
# Caller may set edpm_nmstate_apply_skip_role_setup: true to skip the rest of the
# system-roles network role (package installs for NetworkManager/nmstate/
# python3-libnmstate, service enable, a no-op network_connections call since we never
# set network_connections, a connectivity re-test ping, and sr_fingerprint bookkeeping)
# and call the network_state module directly instead. Only safe when an earlier phase
# in the same run already executed the full role, so those packages/service are already
# known-good; nmstate_tool.yml sets this for the second phase in a two-step SR-IOV apply.
# Collection prefix matches include_role below (EDPM_SYSTEMROLES, default fedora.linux_system_roles).

- name: Render network_state variable (NIC aliases only under nmstate iface keys) - {{ edpm_nmstate_apply_phase }}
  ansible.builtin.set_fact:
    network_state: >-
      {{
        edpm_nmstate_apply_template
        | from_yaml
        | osp.edpm.edpm_substitute_nic_aliases(edpm_nmstate_apply_interface_mapping | default({}))
      }}

# Always show the resolved desired state (aliases already substituted) for every
# phase, including SR-IOV phase 1 which goes through the full system-roles path.
- name: Display nmstate desired state to apply - {{ edpm_nmstate_apply_phase }}
  ansible.builtin.debug:
    # splitlines so the default callback prints real YAML lines, not \n-escaped text
    msg: "{{ (network_state | to_nice_yaml(indent=2)).splitlines() }}"

- name: Load system-roles.network tasks - {{ edpm_nmstate_apply_phase }}
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'EDPM_SYSTEMROLES', default='fedora.linux_system_roles') + '.network' }}"
  register: edpm_nmstate_apply_result
  when: not (edpm_nmstate_apply_skip_role_setup | default(false))

# Direct network_state call lives in nmstate_apply_direct.yml so this file's
# include during phase 1 never parses the templated action FQCN (plugin-load warning).
- name: Apply nmstate state directly - {{ edpm_nmstate_apply_phase }}
  ansible.builtin.include_tasks: nmstate_apply_direct.yml
  when: edpm_nmstate_apply_skip_role_setup | default(false)
