- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Read tuned-main.conf
      ansible.builtin.slurp:
        src: /etc/tuned/tuned-main.conf
      register: tuned_main_conf

    - name: Assert rollback strategy is set
      ansible.builtin.assert:
        that:
          - "'rollback={{ edpm_tuned_rollback | default('not_on_exit') }}' in (tuned_main_conf.content | b64decode)"
        success_msg: "rollback={{ edpm_tuned_rollback | default('not_on_exit') }} present in /etc/tuned/tuned-main.conf"
        fail_msg: "rollback setting missing or wrong in /etc/tuned/tuned-main.conf"
