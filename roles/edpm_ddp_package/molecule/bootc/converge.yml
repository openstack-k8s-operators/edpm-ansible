- name: Converge bootc DDP validation
  hosts: all
  become: true
  gather_facts: false
  vars:
    ddp_test_profile: ddp-comm
    ddp_test_profile_dir: /lib/firmware/intel/ice/ddp-comm
    ddp_test_canonical: /lib/firmware/intel/ice/ddp/ice.pkg
    ddp_test_stage_dir: /tmp/ddp-initramfs-stage
    ddp_test_spy_dir: /opt/ddp-test-spy
  environment:
    PATH: "{{ ddp_test_spy_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Identify the kernel version used by the role
      ansible.builtin.command:
        argv:
          - uname
          - -r
      register: ddp_test_kernel_version
      changed_when: false

    - name: Create directories for the DDP test image
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/ansible/facts.d
        - "{{ ddp_test_profile_dir }}"
        - /lib/firmware/intel/ice/empty-profile
        - /lib/firmware/intel/ice/other-profile
        - /lib/firmware/intel/ice/ddp
        - "{{ ddp_test_stage_dir }}/lib/firmware/intel/ice/ddp"
        - "/usr/lib/modules/{{ ddp_test_kernel_version.stdout }}"
        - "{{ ddp_test_spy_dir }}/bin"

    - name: Mark the test node as bootc
      ansible.builtin.copy:
        dest: /etc/ansible/facts.d/bootc.fact
        content: |
          #!/bin/bash
          echo true
        mode: "0755"

    - name: Install DDP profile package candidates
      ansible.builtin.copy:
        dest: "{{ ddp_test_profile_dir }}/{{ item.name }}"
        content: "{{ item.content }}\n"
        mode: "0644"
      loop:
        - name: ice-1.pkg
          content: older DDP package
        - name: ice-2.pkg
          content: selected DDP package

    - name: Install a package in a different profile for mismatch coverage
      ansible.builtin.copy:
        dest: /lib/firmware/intel/ice/other-profile/ice-9.pkg
        content: a different profile package
        mode: "0644"

    - name: Install a dracut command spy
      ansible.builtin.copy:
        dest: "{{ ddp_test_spy_dir }}/bin/dracut"
        content: |
          #!/bin/bash
          touch "{{ ddp_test_spy_dir }}/dracut.invoked"
          exit 0
        mode: "0755"

    - name: Install a module reload command spy
      ansible.builtin.copy:
        dest: "{{ ddp_test_spy_dir }}/bin/modprobe"
        content: |
          #!/bin/bash
          touch "{{ ddp_test_spy_dir }}/modprobe.invoked"
          exit 0
        mode: "0755"

    - name: Point the canonical DDP path at the selected profile package
      ansible.builtin.file:
        src: "../{{ ddp_test_profile }}/ice-2.pkg"
        dest: "{{ ddp_test_canonical }}"
        state: link
        force: true

    - name: Copy the selected payload to the initramfs fixture tree
      ansible.builtin.copy:
        src: "{{ ddp_test_profile_dir }}/ice-2.pkg"
        dest: "{{ ddp_test_stage_dir }}/lib/firmware/intel/ice/ddp/ice.pkg"
        remote_src: true
        mode: "0644"

    - name: Build a real cpio initramfs fixture containing the canonical DDP path
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && cd {{ ddp_test_stage_dir | quote }} &&
          find lib -print0 | cpio --null --create --format=newc |
          gzip -c >
          {{ ('/usr/lib/modules/' ~ ddp_test_kernel_version.stdout ~ '/initramfs.img') | quote }}
        executable: /bin/bash
      changed_when: true

    - name: Snapshot the canonical link before role validation
      ansible.builtin.stat:
        path: "{{ ddp_test_canonical }}"
        follow: false
        checksum_algorithm: sha256
      register: ddp_test_canonical_before

    - name: Snapshot the selected package before role validation
      ansible.builtin.stat:
        path: "{{ ddp_test_profile_dir }}/ice-2.pkg"
        checksum_algorithm: sha256
      register: ddp_test_package_before

    - name: Snapshot the running kernel initramfs before role validation
      ansible.builtin.stat:
        path: "/usr/lib/modules/{{ ddp_test_kernel_version.stdout }}/initramfs.img"
        checksum_algorithm: sha256
      register: ddp_test_initramfs_before

    - name: Run read-only bootc DDP validation
      ansible.builtin.include_role:
        name: osp.edpm.edpm_ddp_package
      vars:
        edpm_ddp_package: "{{ ddp_test_profile }}"

    - name: Verify canonical link is unchanged by bootc validation
      ansible.builtin.stat:
        path: "{{ ddp_test_canonical }}"
        follow: false
        checksum_algorithm: sha256
      register: ddp_test_canonical_after

    - name: Verify selected package is unchanged by bootc validation
      ansible.builtin.stat:
        path: "{{ ddp_test_profile_dir }}/ice-2.pkg"
        checksum_algorithm: sha256
      register: ddp_test_package_after

    - name: Verify initramfs is unchanged by bootc validation
      ansible.builtin.stat:
        path: "/usr/lib/modules/{{ ddp_test_kernel_version.stdout }}/initramfs.img"
        checksum_algorithm: sha256
      register: ddp_test_initramfs_after

    - name: Assert bootc validation did not modify DDP files or links
      ansible.builtin.assert:
        that:
          - ddp_test_canonical_after.stat.inode == ddp_test_canonical_before.stat.inode
          - ddp_test_canonical_after.stat.lnk_source == ddp_test_canonical_before.stat.lnk_source
          - ddp_test_package_after.stat.inode == ddp_test_package_before.stat.inode
          - ddp_test_package_after.stat.checksum == ddp_test_package_before.stat.checksum
          - ddp_test_initramfs_after.stat.inode == ddp_test_initramfs_before.stat.inode
          - ddp_test_initramfs_after.stat.checksum == ddp_test_initramfs_before.stat.checksum

    - name: Check that forbidden bootc runtime commands were not invoked
      ansible.builtin.stat:
        path: "{{ ddp_test_spy_dir }}/{{ item }}.invoked"
      loop:
        - dracut
        - modprobe
      register: ddp_test_command_spies

    - name: Assert dracut and module reload were not invoked on bootc
      ansible.builtin.assert:
        that:
          - not item.stat.exists
      loop: "{{ ddp_test_command_spies.results }}"
