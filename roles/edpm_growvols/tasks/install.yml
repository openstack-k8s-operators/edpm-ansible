- name: Install growvols packages
  tags:
    - install
    - edpm_growvols
  ansible.builtin.dnf:
    name: "{{ edpm_growvols_packages }}"
    state: present
  become: true
  register: edpm_growvols_packages_install
  until: edpm_growvols_packages_install is succeeded
  retries: "{{ edpm_growvols_download_retries }}"
  delay: "{{ edpm_growvols_download_delay }}"
  when: ansible_local.bootc is not defined or not ansible_local.bootc

- name: Install growvols from role files
  ansible.builtin.copy:
    src: "{{ role_path }}/files/growvols"
    dest: /usr/local/sbin/growvols
    mode: "0755"
  become: true
