- name: Gather ansible_local facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "local"
  when: ansible_local is not defined

- name: Output growvols_args
  ansible.builtin.debug:
    var: growvols_args

- name: Find the growvols utility
  ansible.builtin.shell: >
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
    which growvols
  changed_when: find_growvols.rc == 0
  failed_when: false
  become: true
  register: find_growvols

- name: Set fact whether growvols is enabled
  ansible.builtin.set_fact:
    growvols_enabled: >-
      {{ ansible_local.edpm_growvols.general.enabled | default(false) | bool or
         (ansible_local.edpm_growvols is not defined and find_growvols.rc == 0) }}

- name: Run growvols block
  when: growvols_enabled
  block:
    - name: Install growvols
      when: find_growvols.rc != 0
      ansible.builtin.include_tasks: install.yml

    - name: Setting growvols path
      ansible.builtin.set_fact:
        growvols_path: "{{ find_growvols.stdout_lines[0] | default('/usr/local/sbin/growvols') }}"

    - name: "Running {{ growvols_path + growvols_args }}"
      ansible.builtin.shell: >-
        {{ growvols_path }} --yes {{ growvols_args }}
      become: true
      register: run_growvols
      changed_when: run_growvols.rc == 0
      failed_when: run_growvols.rc != 0

    - name: Output of growvols stdout
      ansible.builtin.debug:
        var: run_growvols.stdout
