---

- name: Gather user fact
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "user"
  when:
    - ansible_user is undefined

- name: Ensure base directory for health checks exists
  become: true
  ansible.builtin.file:
    path: /var/lib/openstack/healthchecks
    state: directory
    setype: container_file_t
    owner: "{{ ansible_user | default(ansible_user_id) }}"
    group: "{{ ansible_user | default(ansible_user_id) }}"
    mode: '0755'

- name: Ensure neutron_sriov health check directory exists
  become: true
  ansible.builtin.file:
    path: /var/lib/openstack/healthchecks/neutron_sriov
    state: directory
    setype: container_file_t
    owner: "{{ ansible_user | default(ansible_user_id) }}"
    group: "{{ ansible_user | default(ansible_user_id) }}"
    mode: '0755'

- name: Deploy neutron_sriov health check script
  become: true
  ansible.builtin.template:
    src: healthchecks/neutron_sriov/healthcheck.j2
    dest: /var/lib/openstack/healthchecks/neutron_sriov/healthcheck
    setype: container_file_t
    owner: "{{ ansible_user | default(ansible_user_id) }}"
    group: "{{ ansible_user | default(ansible_user_id) }}"
    mode: '0755'
