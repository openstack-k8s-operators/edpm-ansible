- name: Converge
  hosts: all
  roles:
    - role: osp.edpm.edpm_cyborg
      vars:
        edpm_cyborg_config_src: "{{lookup('env', 'MOLECULE_PROJECT_DIRECTORY')}}/molecule/default/test-data"
        edpm_cyborg_tls_ca_src_dir: /tmp/pki
        edpm_cyborg_agent_image: "quay.io/amoralej/openstack-cyborg-agent:master-latest"
        edpm_cyborg_extra_bind_mounts:
          - src: /var/lib/test_accel_device
            dest: /var/lib/test_accel_device
            options: "rw"
        # Override kolla command to keep the container running without
        # real OpenStack services so verify can assert on its state.
        edpm_cyborg_kolla_config:
          command: sleep infinity
          config_files:
            - source: /var/lib/kolla/config_files/src/*.conf
              dest: /etc/cyborg/cyborg.conf.d/
              owner: cyborg
              perm: "0600"
              optional: true
          permissions:
            - path: /var/lib/cyborg
              owner: cyborg:cyborg
              recurse: true
