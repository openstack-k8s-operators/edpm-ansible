---

- name: Verify
  hosts: all
  gather_facts: false
  vars:
    test_helper_dir: "../../../../molecule/test-helpers"
    edpm_cyborg_tls_ca_src_dir: /tmp/pki
    edpm_cyborg_config_dest: /var/lib/openstack/cyborg
  tasks:
    - name: ensure expected directories exist
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_dir.yaml"
      loop:
        - "/var/lib/openstack"
        - "{{ edpm_cyborg_config_dest }}"
        - "/var/lib/cyborg"
        - "/etc/nvme"
        - "{{ edpm_cyborg_tls_ca_src_dir }}"

    - name: Check quadlet .container file exists
      become: true
      ansible.builtin.stat:
        path: /etc/containers/systemd/edpm_cyborg_agent.container
      register: _quadlet_file

    - name: Assert quadlet file exists
      ansible.builtin.assert:
        that:
          - _quadlet_file.stat.exists
        fail_msg: "Quadlet .container file was not created"

    - name: Read quadlet file content
      become: true
      ansible.builtin.slurp:
        src: /etc/containers/systemd/edpm_cyborg_agent.container
      register: _quadlet_content

    - name: Decode quadlet file content
      ansible.builtin.set_fact:
        _quadlet_text: "{{ _quadlet_content.content | b64decode }}"

    - name: Verify quadlet file structure
      ansible.builtin.assert:
        that:
          - "'[Unit]' in _quadlet_text"
          - "'[Container]' in _quadlet_text"
          - "'ContainerName=cyborg_agent' in _quadlet_text"
          - "'Network=host' in _quadlet_text"
          - "'User=cyborg' in _quadlet_text"
          - "'PodmanArgs=--privileged --pid=host' in _quadlet_text"
          - "'LogDriver=journald' in _quadlet_text"
          - "'Exec=/usr/bin/cyborg-agent' in _quadlet_text"
          - "'KOLLA_CONFIG_STRATEGY' not in _quadlet_text"
          - "'/var/lib/kolla/config_files' not in _quadlet_text"
          - "'Requires=edpm_cyborg_agent_init.service' in _quadlet_text"
          - "'[Service]' in _quadlet_text"
          - "'Restart=always' in _quadlet_text"
          - "'[Install]' in _quadlet_text"
          - "'WantedBy=multi-user.target' in _quadlet_text"
          - "'Label=managed_by=edpm_ansible' in _quadlet_text"
        fail_msg: "Quadlet file content is incorrect"

    - name: Verify expected volumes are rendered
      vars:
        _expected_config_vol: "Volume={{ edpm_cyborg_config_dest }}/01-cyborg.conf:/etc/cyborg/cyborg.conf.d/01-cyborg.conf:ro"
        _expected_tls_vol: "Volume={{ edpm_cyborg_tls_ca_src_dir }}/tls-ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro,z"
      ansible.builtin.assert:
        that:
          - "_expected_config_vol in _quadlet_text"
          - "'Volume=/etc/localtime:/etc/localtime:ro' in _quadlet_text"
          - "'Volume=/lib/modules:/lib/modules:ro' in _quadlet_text"
          - "'Volume=/dev:/dev' in _quadlet_text"
          - "'Volume=/sys:/sys' in _quadlet_text"
          - "'Volume=/var/lib/cyborg:/var/lib/cyborg:shared' in _quadlet_text"
          - "'Volume=/etc/nvme:/etc/nvme' in _quadlet_text"
          - "'Volume=/var/lib/test_accel_device:/var/lib/test_accel_device:rw' in _quadlet_text"
          - "_expected_tls_vol in _quadlet_text"
        fail_msg: "Missing volume in cyborg_agent .container file"

    - name: Verify config_hash is populated
      ansible.builtin.assert:
        that:
          - "_quadlet_text is regex('# config_hash=.+')"
        fail_msg: "config_hash was not injected into Quadlet file"

    - name: Verify staged file exists in rendering directory
      become: true
      ansible.builtin.stat:
        path: /var/lib/edpm-config/quadlet-rendered/edpm_cyborg_agent.container
      register: _staged_file

    - name: Assert staged file exists
      ansible.builtin.assert:
        that:
          - _staged_file.stat.exists
        fail_msg: "Staged .container file was not created in rendering directory"

    - name: Check cyborg agent init quadlet file exists
      become: true
      ansible.builtin.stat:
        path: /etc/containers/systemd/edpm_cyborg_agent_init.container
      register: _init_quadlet_file

    - name: Assert cyborg agent init quadlet file exists
      ansible.builtin.assert:
        that:
          - _init_quadlet_file.stat.exists
        fail_msg: "Cyborg agent init Quadlet file was not created"

    - name: Read cyborg agent init quadlet file content
      become: true
      ansible.builtin.slurp:
        src: /etc/containers/systemd/edpm_cyborg_agent_init.container
      register: _init_quadlet_content

    - name: Decode cyborg agent init quadlet file content
      ansible.builtin.set_fact:
        _init_quadlet_text: "{{ _init_quadlet_content.content | b64decode }}"

    - name: Verify cyborg agent init container chowns the state dir
      ansible.builtin.assert:
        that:
          - "'ContainerName=cyborg_agent_init' in _init_quadlet_text"
          - "'User=root' in _init_quadlet_text"
          - "'Exec=/usr/bin/chown -R cyborg:cyborg /var/lib/cyborg' in _init_quadlet_text"
          - "'Volume=/var/lib/cyborg:/var/lib/cyborg:shared' in _init_quadlet_text"
          - "'Type=oneshot' in _init_quadlet_text"
        fail_msg: "Cyborg agent init Quadlet file content is incorrect"

    - name: Verify state file tracking
      block:
        - name: Read deployed services state file
          become: true
          ansible.builtin.slurp:
            src: /var/lib/edpm-config/deployed_services.yaml
          register: _state_file

        - name: Parse state data
          ansible.builtin.set_fact:
            _state_data: "{{ _state_file.content | b64decode | from_yaml }}"

        - name: Assert cyborg service is tracked in state file
          ansible.builtin.assert:
            that:
              - "'cyborg' in _state_data.services"
              - "'cyborg_agent' in _state_data.services.cyborg.containers"
              - "'cyborg_agent_init' in _state_data.services.cyborg.containers"
            fail_msg: "Cyborg service not tracked in state file"

    - name: ensure systemd services are defined
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_systemd_unit.yaml"
      loop:
        - {"name": "edpm_cyborg_agent.service", "running": false}
        # oneshot: quadlet removes the container (--rm) after chown; unit stays active
        - {"name": "edpm_cyborg_agent_init.service", "running": true}

    - name: ensure podman container exists
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_podman.yaml"
      loop:
        - {"name": "cyborg_agent", "running": false}

    - name: Check that init container chowned the cyborg statedir
      become: true
      ansible.builtin.stat:
        path: /var/lib/cyborg
      register: cyborg_statedir

    - name: Assert cyborg statedir is owned by the container uid
      ansible.builtin.assert:
        that:
          - cyborg_statedir.stat.exists
          - cyborg_statedir.stat.uid == 42485

    - name: Check if after sync old file is removed
      ansible.builtin.stat:
        path: '/var/lib/openstack/cyborg/test.conf'
      register: cyborg_old_test_conf

    - name: Assert that stale config file was removed by sync
      ansible.builtin.assert:
        that:
          - "not cyborg_old_test_conf.stat.exists"

    - name: Verify cyborg config was synced
      ansible.builtin.stat:
        path: "{{ edpm_cyborg_config_dest }}/01-cyborg.conf"
      register: cyborg_conf

    - name: Assert cyborg config exists
      ansible.builtin.assert:
        that:
          - cyborg_conf.stat.exists
