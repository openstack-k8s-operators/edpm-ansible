---

- name: Check if ca bundle exists
  ansible.builtin.stat:
    path: "{{ edpm_cyborg_tls_ca_src_dir }}/tls-ca-bundle.pem"
  register: ca_bundle_stat_res

- name: Set cyborg role path for quadlet templates
  ansible.builtin.set_fact:
    _edpm_cyborg_role_path: "{{ role_path }}"

- name: Deploy cyborg agent init container
  tags:
    - install
    - cyborg
  ansible.builtin.include_role:
    name: osp.edpm.edpm_container_standalone
  vars:
    edpm_container_standalone_use_quadlet: true
    edpm_container_standalone_service: "cyborg_agent_init"
    edpm_service_name: "{{ edpm_cyborg_service_name }}"
    edpm_container_state_append: false
    edpm_container_standalone_quadlet_defs:
      cyborg_agent_init: "{{ _edpm_cyborg_role_path }}/templates/quadlet/cyborg_agent_init.container.j2"
    ca_bundle_exists: "{{ ca_bundle_stat_res.stat.exists }}"

- name: Deploy cyborg agent container
  tags:
    - install
    - cyborg
  ansible.builtin.include_role:
    name: osp.edpm.edpm_container_standalone
  vars:
    edpm_container_standalone_use_quadlet: true
    edpm_container_standalone_service: "cyborg_agent"
    edpm_service_name: "{{ edpm_cyborg_service_name }}"
    edpm_container_state_append: true
    edpm_container_standalone_quadlet_defs:
      cyborg_agent: "{{ _edpm_cyborg_role_path }}/templates/quadlet/cyborg_agent.container.j2"
    ca_bundle_exists: "{{ ca_bundle_stat_res.stat.exists }}"
