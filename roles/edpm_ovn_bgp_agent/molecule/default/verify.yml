---
- name: Verify ovn_bgp_agent
  gather_facts: false
  hosts: all
  vars:
    test_helper_dir: "../../../../molecule/test-helpers"
  tasks:
    - name: Ensure expected directories exist
      ansible.builtin.include_tasks: "{{ test_helper_dir }}/verify_dir.yaml"
      loop:
        - "/var/lib/openstack/ovn-bgp-agent/etc/ovn-bgp-agent/bgp-agent.conf"

    - name: Ensure Quadlet .container file exists
      ansible.builtin.stat:
        path: "/etc/containers/systemd/edpm_ovn_bgp_agent.container"
      register: _quadlet_file
      failed_when: not _quadlet_file.stat.exists

    - name: Ensure staged Quadlet file exists
      ansible.builtin.stat:
        path: "/var/lib/edpm-config/quadlet-rendered/edpm_ovn_bgp_agent.container"
      register: _staged_file
      failed_when: not _staged_file.stat.exists

    - name: Read Quadlet file content
      become: true
      ansible.builtin.slurp:
        src: "/etc/containers/systemd/edpm_ovn_bgp_agent.container"
      register: _quadlet_content

    - name: Verify config_hash is populated in Quadlet file
      ansible.builtin.assert:
        that:
          - "(_quadlet_content.content | b64decode) is regex('# config_hash=.+')"
        fail_msg: "config_hash placeholder was not populated in Quadlet file"

    - name: Ensure podman container exists and is running
      ansible.builtin.include_tasks: "{{ test_helper_dir }}/verify_podman.yaml"
      loop:
        - "ovn_bgp_agent"

    - name: Ensure systemd services are defined and functional
      ansible.builtin.include_tasks: "{{ test_helper_dir }}/verify_systemd_unit.yaml"
      loop:
        - {"name": "edpm_ovn_bgp_agent.service"}

    - name: Verify ovn_bgp_agent Quadlet file has no kolla references
      ansible.builtin.assert:
        that:
          - "'Exec=/usr/bin/ovn-bgp-agent --config-dir /etc/ovn-bgp-agent' in _ovn_bgp_agent_content"
          - "'KOLLA_CONFIG_STRATEGY' not in _ovn_bgp_agent_content"
          - "'/var/lib/kolla/config_files' not in _ovn_bgp_agent_content"
          - "'Volume=/var/lib/openstack/ovn-bgp-agent/etc/ovn-bgp-agent/bgp-agent.conf:/etc/ovn-bgp-agent/bgp-agent.conf:ro' in _ovn_bgp_agent_content"
          - "'Volume=/var/lib/openstack/ovn-bgp-agent/etc/ovn-bgp-agent/10-neutron-ovn.conf:/etc/ovn-bgp-agent/10-neutron-ovn.conf:ro' in _ovn_bgp_agent_content"
      vars:
        _ovn_bgp_agent_content: "{{ _quadlet_content.content | b64decode }}"
