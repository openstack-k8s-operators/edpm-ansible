- name: Login to container registries if needed
  ansible.builtin.include_role:
    name: osp.edpm.edpm_podman
    tasks_from: login.yml
    apply:
      become: true
  tags:
    - edpm_podman
    - edpm_upgrade_services

- name: Apply 18->19 upgrade for edpm_neutron_ovn role
  ansible.builtin.include_role:
    name: osp.edpm.edpm_neutron_ovn
    tasks_from: upgrade.yml
    apply:
      become: true
  tags:
    - edpm_neutron_ovn
    - edpm_upgrade_services
  when: '"neutron-ovn" in edpm_upgrade_services_running_services'

- name: Redeploy containers for edpm_neutron_ovn role
  ansible.builtin.include_role:
    name: osp.edpm.edpm_neutron_ovn
    tasks_from: run.yml
    apply:
      become: true
  tags:
    - edpm_neutron_ovn
    - edpm_upgrade_services
  when:
    - '"neutron-ovn" in edpm_upgrade_services_running_services'
    - ansible_local.edpm_upgrade.upgrade.to_version | default('') != '19'
