# The default verify playbook asserts the rest of the configuration is still
# what the role mandates; the purge must not disturb anything else.
- name: Run the default verify playbook
  import_playbook: ../default/verify.yml

- name: Verify (skip_kpartx exceptions purge)
  hosts: all
  gather_facts: false
  tasks:
    - name: Read /etc/multipath.conf
      become: true
      ansible.builtin.slurp:
        src: /etc/multipath.conf
      register: multipath_conf

    - name: Decode /etc/multipath.conf
      ansible.builtin.set_fact:
        multipath_conf_content: "{{ multipath_conf.content | b64decode }}"

    - name: Verify the boot device exemptions were removed
      ansible.builtin.assert:
        that:
          - "'BEGIN ANSIBLE MANAGED BLOCK edpm_multipathd boot devices' not in multipath_conf_content"
          - "'skip_kpartx no' not in multipath_conf_content"
        fail_msg: >-
          /etc/multipath.conf still carries boot device exemptions after the
          purge. Content was: {{ multipath_conf_content }}

    - name: Verify multipathd accepts the resulting configuration
      become: true
      ansible.builtin.command: multipath -t
      changed_when: false
