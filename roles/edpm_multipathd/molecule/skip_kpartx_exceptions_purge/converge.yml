- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    # The test host does not boot from SAN, so the detection comes back empty
    # while /etc/multipath.conf still carries the exemptions seeded by the
    # prepare playbook. The role has to refuse the removal and explain how
    # to do it deliberately. In check mode the guard is skipped by design,
    # and the seeded state is gone by then anyway, so only assert for real.
    - name: Expect the role to refuse removing the exemptions
      when: not ansible_check_mode
      block:
        - name: Run the role without the purge override
          ansible.builtin.include_role:
            name: osp.edpm.edpm_multipathd
        - name: The role must have refused above
          ansible.builtin.fail:
            msg: the role did not refuse the removal
      rescue:
        - name: The refusal must come from the removal guard
          ansible.builtin.assert:
            that:
              - "'edpm_multipathd_skip_kpartx_purge_exemptions' in ansible_failed_result.msg"
            fail_msg: >-
              The role failed for a different reason than the removal guard:
              {{ ansible_failed_result.msg }}

    # The escape hatch: with the purge override the same empty detection must
    # remove the block instead of failing.
    - name: Purge the exemptions through the escape hatch
      ansible.builtin.include_role:
        name: osp.edpm.edpm_multipathd
      vars:
        edpm_multipathd_skip_kpartx_purge_exemptions: true
        # The test host does not boot from SAN, so rebuilding its initramfs
        # would be both pointless and disruptive. The purge cannot trigger a
        # rebuild on its own either, because the regeneration is gated on a
        # non-empty exception list.
        edpm_multipathd_regenerate_initramfs: false
