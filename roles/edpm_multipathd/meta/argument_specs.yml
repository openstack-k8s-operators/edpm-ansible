---
argument_specs:
  # ./roles/edpm_multipathd/tasks/main.yml entry point
  main:
    short_description: The main entry point for the edpm_multipathd role.
    options:
      edpm_multipathd_image_download_delay:
        type: int
        default: 5
        description: The seconds between retries for failed download tasks
      edpm_multipathd_image_download_retries:
        type: int
        default: 5
        description: The number of retries for failed download tasks
      edpm_multipathd_packages:
        type: list
        description: The list of packages to install for multipathd.
        default:
          - device-mapper-multipath
      edpm_multipathd_custom_config_dir:
        default: '/runner/multipath'
        description: >-
          Directory used by the ansibleee-runner pod to install a custom
          multipath.conf file.
        type: str
      edpm_multipathd_enable:
        default: true
        description: 'Whether to enable the multipath daemon.'
        type: bool
      edpm_multipathd_find_multipaths:
        default: true
        description: >-
          Whether to automatically create a multipath device for each path.
        type: bool
      edpm_multipathd_recheck_wwid:
        default: true
        description: >-
          Whether to recheck the path WWID when a failed path is restored.
        type: bool
      edpm_multipathd_skip_kpartx:
        default: true
        description: >-
          Whether to skip automatically creating partitions on the device.
        type: bool
      edpm_multipathd_user_friendly_names:
        default: false
        description: >-
          Whether to enable assigning a user friendly name to each path.
        type: bool
      edpm_multipathd_skip_kpartx_autodetect_boot_devices:
        default: true
        description: >-
          Whether to detect the multipath devices backing the boot critical
          filesystems of the node and exempt them from skip_kpartx. Without
          the exemption a node that boots from SAN has no partition device
          nodes for its root map and drops to the dracut emergency shell.
        type: bool
      edpm_multipathd_skip_kpartx_exceptions:
        default: []
        description: >-
          Additional WWIDs to exempt from skip_kpartx, for boot critical
          multipath maps that the autodetection cannot see. These are merged
          with the autodetected WWIDs.
        type: list
      edpm_multipathd_regenerate_initramfs:
        default: true
        description: >-
          Whether to rebuild the initramfs when /etc/multipath.conf changes on
          a node whose boot path uses multipath. The initramfs embeds a copy of
          the configuration, so without this the node keeps booting with the
          previous one.
        type: bool
      edpm_multipathd_rebuild_initramfs_command:
        default: 'dracut --force --regenerate-all'
        description: >-
          The command used to rebuild the initramfs. All installed kernels are
          regenerated because the update workflow installs a new kernel before
          this role runs.
        type: str
      edpm_multipathd_custom_config_file:
        default: ''
        description: >-
          Fully qualified path of a local multipath.conf file to be
          installed on the overcloud nodes. By default, a minimal
          multipath.conf file will be installed. NOTE - Other TripleO
          multipath parameters will override any corresponding
          value in the local custom config file. For example, if
          MultipathdEnableUserFriendlyNames is False, the files on the
          overcloud nodes will be updated match, even if the setting is
          enabled in the local custom file.
        type: str
      edpm_multipathd_legacy_services:
        type: list
        description: |
          The list of legacy containerized services associated with adoption
          and brownfield deployment scenarios.
        default:
          - tripleo_multipathd.service
          - edpm_multipathd.service
