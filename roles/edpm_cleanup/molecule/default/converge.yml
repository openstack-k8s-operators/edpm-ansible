- name: Deploy first service
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Gather user fact
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - "user"

    - name: Set basic user fact
      ansible.builtin.set_fact:
        ansible_user: "{{ ansible_user_id | default(lookup('env', 'USER')) }}"
      when:
        - ansible_user is undefined
  vars:
    edpm_container_standalone_service: test_service1_container
    edpm_service_name: test_service1
    edpm_container_standalone_container_defs:
      test_service1_container:
        image: quay.io/centos/centos:stream9
        net: host
        privileged: true
        restart: always
        command: sleep 3600
  roles:
    - role: "osp.edpm.edpm_container_standalone"
  tasks:
    - name: Create container-scoped healthcheck directory for first service
      become: true
      ansible.builtin.file:
        path: /var/lib/openstack/healthchecks/test_service1_container
        state: directory
        mode: '0755'

- name: Deploy second service
  hosts: all
  gather_facts: false
  vars:
    edpm_container_standalone_service: test_service2
    edpm_container_standalone_container_defs:
      test_service2_container:
        image: quay.io/centos/centos:stream10
        net: host
        privileged: true
        restart: always
        command: sleep 3600
  roles:
    - role: "osp.edpm.edpm_container_standalone"

- name: Cleanup first service (keep only test_service2)
  hosts: all
  gather_facts: false
  vars:
    edpm_service_types:
      - test_service2
  roles:
    - role: osp.edpm.edpm_cleanup

- name: Deploy service with multiple containers
  hosts: all
  gather_facts: false
  vars:
    edpm_container_standalone_service: test_service3
    edpm_container_standalone_container_defs:
      test_service3_container_a:
        image: quay.io/centos/centos:stream10
        net: host
        privileged: true
        restart: always
        command: sleep 3600
      test_service3_container_b:
        image: quay.io/centos/centos:stream10
        net: host
        privileged: true
        restart: always
        command: sleep 3600
  roles:
    - role: osp.edpm.edpm_container_standalone

- name: Update service - remove container_b and add container_c
  hosts: all
  gather_facts: false
  vars:
    edpm_container_standalone_service: test_service3
    edpm_container_standalone_container_defs:
      test_service3_container_a:
        image: quay.io/centos/centos:stream10
        net: host
        privileged: true
        restart: always
        command: sleep 3600
      test_service3_container_c:
        image: quay.io/centos/centos:stream10
        net: host
        privileged: true
        restart: always
        command: sleep 3600
  roles:
    - role: osp.edpm.edpm_container_standalone
  tasks:
    - name: Simulate legacy kolla config files from pre-upgrade deployment
      become: true
      ansible.builtin.file:
        path: /var/lib/kolla/config_files
        state: directory
        mode: "0755"

    - name: Create simulated legacy kolla config files
      become: true
      ansible.builtin.copy:
        content: "{{ {} | to_nice_json }}"
        dest: "/var/lib/kolla/config_files/{{ item }}.json"
        mode: "0600"
      loop:
        - test_service3_container_a
        - test_service3_container_b

    - name: Cleanup orphaned containers (will remove container_b)
      ansible.builtin.include_role:
        name: osp.edpm.edpm_cleanup
      vars:
        edpm_service_types:
          - test_service2
          - test_service3
        edpm_cleanup_orphaned_containers: true
