argument_specs:
  # roles/edpm_telemetry/tasks/main.yml entry point
  main:
    short_description: The main entry point for the edpm_telemetry role.
    options:
      edpm_telemetry_ceilometer_ipmi_image:
        type: "str"
        required: true
        description: "The name of the ceilometer ipmi podman image"
      edpm_telemetry_config_src:
        type: "str"
        required: true
        description: "The path in the ansibleEE container where the config files are stored"
      edpm_telemetry_config_dest:
        type: "str"
        required: true
        description: "The path in the compute node where the config files are copied to"
      edpm_telemetry_certs:
        type: "str"
        required: true
        description: "The path in the compute node where the certs are stored"
      edpm_telemetry_cacerts:
        type: "str"
        required: true
        description: "The path in the compute node where the cacerts are stored"
      edpm_telemetry_old_tripleo_compute_sevices:
        type: list
        required: true
        description: List of ceilometer agents to be stopped during EDPM adoption
      edpm_telemetry_power_monitoring_healthcheck_sources:
        type: dict
        required: true
        description: >
          Contains information about distribution of container health check scripts.
          Keys state for container names and value is name of a script directory
          from module's files directory.
      edpm_telemetry_ceilometer_agent_ipmi_common_volumes:
        type: list
        required: false
        default:
          - "{{ edpm_telemetry_config_dest }}/ceilometer.conf:/etc/ceilometer/ceilometer.conf:ro"
          - "{{ edpm_telemetry_config_dest }}/polling.yaml:/etc/ceilometer/polling.yaml:ro"
          - "{{ edpm_telemetry_config_dest }}/ceilometer-host-specific.conf:/etc/ceilometer/ceilometer.conf.d/02-ceilometer-host-specific.conf:ro"
          - /etc/hosts:/etc/hosts:ro
          - /etc/pki/tls/certs/ca-bundle.trust.crt:/etc/pki/tls/certs/ca-bundle.trust.crt:ro
          - /etc/localtime:/etc/localtime:ro
          - /etc/pki/ca-trust/source/anchors:/etc/pki/ca-trust/source/anchors:ro
          - /dev/log:/dev/log
        description: "List of always-present volume mounts for ceilometer_agent_ipmi"
      edpm_telemetry_ceilometer_agent_ipmi_custom_conf_volumes:
        type: list
        required: false
        default:
          - "{{ edpm_telemetry_config_dest }}/custom.conf:/etc/ceilometer/ceilometer.conf.d/01-ceilometer-custom.conf:ro"
        description: "List of volume mounts for the custom ceilometer.conf.d drop-in in ceilometer_agent_ipmi"
      edpm_telemetry_ceilometer_agent_ipmi_tls_cacert_volumes:
        type: list
        required: false
        default:
          - "{{ edpm_telemetry_cacerts }}/tls-ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro,z"
        description: "List of CA bundle volume mounts for ceilometer_agent_ipmi, added when CA bundle exists"
      edpm_telemetry_ceilometer_agent_ipmi_tls_volumes:
        type: list
        required: false
        default:
          - "{{ edpm_telemetry_certs }}:/etc/ceilometer/tls:z"
        description: "List of TLS volume mounts for ceilometer_agent_ipmi, added when TLS certs exist"
