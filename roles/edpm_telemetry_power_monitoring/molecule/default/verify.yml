- name: Verify ceilometer
  hosts: all
  vars:
    test_helper_dir: "../../../../molecule/test-helpers"
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: ensure expected config files exist
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_dir.yaml"
      loop:
        - "{{ edpm_telemetry_config_dest }}/ceilometer.conf"
        - "{{ edpm_telemetry_config_dest }}/polling.yaml"
        - "{{ edpm_telemetry_config_dest }}/ceilometer-host-specific.conf"
        - "{{ edpm_telemetry_config_dest }}/firewall.yaml"

    - name: Slurp host specific config
      ansible.builtin.slurp:
        src: "{{ edpm_telemetry_config_dest }}/ceilometer-host-specific.conf"
      register: host_specific_config

    - name: Assert prometheus TLS is enabled in host specific config when certs exist
      ansible.builtin.assert:
        that:
          - "'prometheus_tls_enable = True' in _host_specific"
          - "'prometheus_tls_certfile = /etc/ceilometer/tls/tls.crt' in _host_specific"
          - "'prometheus_tls_keyfile = /etc/ceilometer/tls/tls.key' in _host_specific"
          - "'prometheus_tls_client_ca = /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem' in _host_specific"
      vars:
        _host_specific: "{{ host_specific_config.content | b64decode }}"

    - name: ensure podman container exists and are running
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_podman.yaml"
      loop:
        - "ceilometer_agent_ipmi"

    - name: ensure systemd services are defined and functional
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_systemd_unit.yaml"
      loop:
        - {"name": "edpm_ceilometer_agent_ipmi.service"}

    - name: Read rendered ceilometer_agent_ipmi .container file
      become: true
      ansible.builtin.slurp:
        src: /etc/containers/systemd/edpm_ceilometer_agent_ipmi.container
      register: _ceilometer_ipmi_container

    - name: Verify ceilometer_agent_ipmi config_hash and volumes
      ansible.builtin.assert:
        that:
          - "'# config_hash=' in _container_content"
          - "_container_content | regex_search('# config_hash=.+')"
          - "'Exec=/usr/bin/ceilometer-polling' in _container_content"
          - "'KOLLA_CONFIG_STRATEGY' not in _container_content"
          - "'/var/lib/kolla/config_files' not in _container_content"
          - "':/etc/ceilometer/ceilometer.conf:ro' in _container_content"
          - "':/etc/ceilometer/polling.yaml:ro' in _container_content"
          - "'/etc/ceilometer/ceilometer.conf.d/02-ceilometer-host-specific.conf:ro' in _container_content"
          - "'Volume=/etc/hosts:/etc/hosts:ro' in _container_content"
          - "'ca-bundle.trust.crt' not in _container_content"
          - "'Volume=/etc/localtime:/etc/localtime:ro' in _container_content"
          - "'Volume=/etc/pki/ca-trust/source/anchors:/etc/pki/ca-trust/source/anchors:ro' in _container_content"
          - "'Volume=/dev/log:/dev/log' in _container_content"
          - "'Volume={{ edpm_telemetry_certs }}:/etc/ceilometer/tls:z' in _container_content"
          - "'Volume=/var/lib/openstack/healthchecks/ceilometer_agent_ipmi:/openstack:ro,z' in _container_content"
          - "'tls-ca-bundle.pem' not in _container_content"
        fail_msg: "config_hash or volume mismatch in ceilometer_agent_ipmi .container file"
      vars:
        _container_content: "{{ _ceilometer_ipmi_container.content | b64decode }}"

    - name: Gather selinux facts (verify)
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - selinux

    - name: Re-check ceilometer_polling_t availability (verify)
      ansible.builtin.command:
        cmd: >-
          python3 -c "import selinux, sys;
          sys.exit(0 if selinux.security_check_context('system_u:system_r:ceilometer_polling_t:s0') == 0 else 1)"
      register: _verify_polling_type
      changed_when: false
      failed_when: false

    - name: Verify ceilometer_polling_t security-opt matches loaded-policy state
      ansible.builtin.assert:
        that:
          - >-
            (_expected and ('--security-opt label=type:ceilometer_polling_t' in _container_content))
            or (not _expected and ('--security-opt label=type:ceilometer_polling_t' not in _container_content))
          # the unconditional parts of the PodmanArgs line are always present
          - "'--privileged' in _container_content"
          - "'--log-driver=journald' in _container_content"
        fail_msg: "ceilometer_polling_t security-opt does not match loaded-policy availability"
      vars:
        _container_content: "{{ _ceilometer_ipmi_container.content | b64decode }}"
        _expected: >-
          {{ (ansible_facts.selinux.status | default('disabled') == 'enabled')
             and ((_verify_polling_type.rc | default(1)) == 0) }}
