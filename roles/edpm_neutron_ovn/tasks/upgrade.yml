# Remove the old container_manage unit from /etc/systemd/system/ so it does not
# shadow the Quadlet-generated unit in /run/systemd/generator/ (systemd
# precedence). No daemon_reload here — run.yml's quadlet path reloads systemd.
- name: Remove legacy container_manage unit that shadows Quadlet
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/edpm_ovn_agent.service"
    state: absent

- name: Redeploy Neutron OVN service after upgrade tasks
  ansible.builtin.include_tasks:
    file: run.yml
    apply:
      become: true
      tags:
        - edpm_neutron_ovn
        - edpm_upgrade_services
  tags:
    - edpm_neutron_ovn
    - edpm_upgrade_services
