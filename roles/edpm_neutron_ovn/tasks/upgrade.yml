# One-time 18->19 upgrade tasks for the Neutron OVN agent
# (container_manage -> Quadlet). Invoked by the edpm_upgrade_services
# orchestrator, which redeploys the service via run.yml afterwards.
# The migration tasks below are idempotent and are skipped once the
# node-level upgrade marker is set. Note: the orchestrator's run.yml
# redeploy is idempotent and still runs on re-invocation.
- name: Gather ansible_local fact
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "local"
  when:
    - ansible_local is undefined

- name: Skip Neutron OVN upgrade if already applied
  when:
    - ansible_local.edpm_upgrade is defined
    - ansible_local.edpm_upgrade.upgrade is defined
    - ansible_local.edpm_upgrade.upgrade.to_version | default('') == '19'
  ansible.builtin.meta: end_role


# Remove the old container_manage unit from /etc/systemd/system/ so it does not
# shadow the Quadlet-generated unit in /run/systemd/generator/ (systemd
# precedence). No daemon_reload here — run.yml's quadlet path reloads systemd.
- name: Remove legacy container_manage unit that shadows Quadlet
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/edpm_ovn_agent.service"
    state: absent
