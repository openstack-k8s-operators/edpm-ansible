- name: Set cacert mount if present
  block:
    - name: Determine if cacert file exists
      ansible.builtin.stat:
        path: "{{ edpm_neutron_ovn_tls_cacert_bundle_src }}"
      register: cacert_bundle_exists

    - name: Set ca_cert mount
      ansible.builtin.set_fact:
        edpm_neutron_ovn_tls_cacert_volumes:
          - "{{ edpm_neutron_ovn_tls_cacert_bundle_src }}:{{ edpm_neutron_ovn_tls_cacert_bundle_dest }}:ro,z"
      when: cacert_bundle_exists.stat.exists

- name: Configure ovn_agent Unbound configuration when provided
  become: true
  when: edpm_neutron_ovn_unbound_conf_content | length > 0
  block:
    - name: Stat ovn_agent Unbound configuration directory
      ansible.builtin.stat:
        path: "{{ edpm_neutron_ovn_unbound_conf_src | dirname }}"
      register: _ovn_agent_unbound_dir

    - name: Create ovn_agent Unbound configuration directory when missing
      ansible.builtin.file:
        path: "{{ edpm_neutron_ovn_unbound_conf_src | dirname }}"
        state: directory
        mode: "0755"
      when: not _ovn_agent_unbound_dir.stat.exists

    - name: Write ovn_agent Unbound configuration
      ansible.builtin.copy:
        dest: "{{ edpm_neutron_ovn_unbound_conf_src }}"
        content: "{{ edpm_neutron_ovn_unbound_conf_content }}"
        owner: root
        group: root
        mode: "0644"

- name: Ensure /var/local/libexec/edpm-start-podman-container exists
  ansible.builtin.import_role:
    name: edpm_container_manage
    tasks_from: shutdown.yml

- name: Update ovn_agent sidecar scripts
  ansible.builtin.include_tasks:
    file: sidecar.yml

- name: Run ovn_agent container
  ansible.builtin.include_role:
    name: osp.edpm.edpm_container_standalone
  vars:
    edpm_container_standalone_service: ovn_agent
    edpm_container_standalone_container_defs:
      ovn_agent: "{{ lookup('template', 'container_defs/ovn_agent.yaml.j2') | from_yaml }}"
    edpm_container_standalone_kolla_config_files:
      ovn_agent: "{{ lookup('file', 'kolla_config/kolla_ovn_agent.yaml') | from_yaml }}"
