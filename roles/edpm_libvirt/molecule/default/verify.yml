---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: compute-1
  gather_facts: false
  vars:
    test_helper_dir: "../../../../molecule/test-helpers"
  tasks:
    - name: ensure libvirt socket activation drop-in directories exist
      ansible.builtin.include_tasks: "test-helpers/verify_logging.yaml"
      loop:
        - {"dest": "/etc/libvirt/virtlogd.conf"}
        - {"dest": "/etc/libvirt/virtnodedevd.conf"}
        - {"dest": "/etc/libvirt/virtproxyd.conf"}
        - {"dest": "/etc/libvirt/virtsecretd.conf"}
        - {"dest": "/etc/libvirt/virtqemud.conf", "expected": "1:qemu 2:libvirt 3:object 4:json"}
    - name: ensure expected directories exist
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_dir.yaml"
      loop:
        # common directories
        - "/etc/tmpfiles.d/"
        - "/var/lib/openstack"
        # extrenal deps
        - "/var/lib/openstack/config/ceph"
        # libvirt directories
        - "/var/lib/libvirt"
        - "/etc/libvirt"
    - name: ensure firewall is configured
      ansible.builtin.include_tasks: "test-helpers/verify_firewall.yaml"
    # TEMPORARY DIAGNOSTIC: virtnodedevd.service lands in 'failed' on CentOS 10. Converge
    # passes because edpm_libvirt.target's Wants= is non-fatal, so the failure only shows
    # up in the assert below. A podman container repro starts the daemon fine, so the
    # journal from a real run is the only way to identify the cause. Remove once diagnosed.
    - name: Collect libvirt systemd diagnostics
      become: true
      ansible.builtin.shell: |
        set +x
        for u in virtnodedevd virtproxyd virtqemud virtsecretd virtlogd; do
          echo "### $u.service is-active: $(systemctl is-active $u.service)"
          systemctl show $u.service -p ActiveState,SubState,Result,ExecMainStatus,ExecMainCode
          systemctl show $u.service -p NRestarts,StartLimitHit,TriggerLimitHit,LoadState,UnitFileState
          systemctl status $u.service --no-pager -l 2>&1 | head -25
          journalctl -u $u.service --no-pager -n 40 2>&1
        done
        echo "### edpm_libvirt.target"
        systemctl show edpm_libvirt.target -p ActiveState,SubState,Wants,After
        systemctl list-dependencies --no-pager edpm_libvirt.target 2>&1 | head -25
        journalctl -u edpm_libvirt.target --no-pager -n 20 2>&1
        echo "### all libvirt units"
        systemctl list-units --all --no-pager --no-legend 'libvirt*' 'virt*' 2>&1
        echo "### rendered daemon configs"
        for f in virtnodedevd virtproxyd virtqemud virtsecretd virtlogd; do
          echo "--- /etc/libvirt/$f.conf"
          cat /etc/libvirt/$f.conf 2>&1
        done
        echo "### TLS material (virtproxyd exits at startup if listen_tls has no cert)"
        ls -l /etc/pki/libvirt /etc/pki/libvirt/private /etc/pki/libvirt-routed \
             /etc/pki/libvirt-vproxy /etc/pki/qemu /tmp/pki 2>&1
        echo "### versions"
        rpm -q libvirt-daemon-driver-nodedev libvirt-daemon libvirt-client systemd dbus-broker 2>&1
        echo "### conf file perms/owner/SELinux labels (DAC ground truth)"
        ls -ldZ /etc/libvirt 2>&1
        ls -lZ /etc/libvirt/*.conf 2>&1
        echo "### conf file mtime vs ctime (ctime>mtime => chmod/chown after write)"
        stat -c '%n mode=%a owner=%U:%G mtime=%y ctime=%z' /etc/libvirt /etc/libvirt/virt*.conf 2>&1
        echo "### runtime user/group/SELinux context of libvirt daemons"
        ps -e -o pid,user,group,context,comm 2>/dev/null | grep -E 'virt(qemu|nodedev|proxy|secret|log)d'
        echo "### root groups (dac_read_search depends on these)"
        id 2>&1
        echo "### pure-DAC test as libvirt user (no SELinux context change)"
        runuser -l libvirt -c 'cat /etc/libvirt/virtnodedevd.conf >/dev/null' 2>&1 \
          && echo "libvirt-user: READABLE" || echo "libvirt-user: DENIED"
        echo "### node systemd drop-ins for virtnodedevd (User=/capability overrides)"
        systemctl cat virtnodedevd.service 2>&1 | head -60
        echo "### tmpfiles.d rules touching libvirt"
        grep -ri libvirt /etc/tmpfiles.d /usr/lib/tmpfiles.d 2>/dev/null | head -20
        echo "### libvirt package install times (was a rpm txn after role write?)"
        for p in libvirt-daemon libvirt-daemon-driver-nodedev libvirt-daemon-driver-qemu \
                 libvirt-daemon-driver-secret libvirt-daemon-log libvirt-daemon-proxy; do
          rpm -q --last "$p" 2>&1
        done
        echo "### selinux / avc"
        getenforce 2>&1
        journalctl -k --no-pager --grep=avc -n 20 2>&1
        (ausearch -m avc --start boot 2>/dev/null || grep avc /var/log/audit/audit.log 2>/dev/null) \
          | grep -E 'virtnodedevd|virtproxyd|virtqemud|virtsecretd|virtlogd' | tail -50
        echo "### runcon test: replay config read in each daemon SELinux context"
        for d in virtqemud virtnodedevd virtproxyd virtsecretd virtlogd; do
          if runcon -t "${d}_t" cat "/etc/libvirt/${d}.conf" >/dev/null 2>&1; then
            echo "${d}.conf: READABLE by ${d}_t";
          else
            echo "${d}.conf: DENIED for ${d}_t";
          fi;
        done
        echo "### priority<=3 journal"
        journalctl --no-pager -p 3 -n 60 2>&1
      register: libvirt_diag
      changed_when: false
      failed_when: false

    - name: Show libvirt systemd diagnostics
      ansible.builtin.debug:
        var: libvirt_diag.stdout_lines

    - name: ensure systemd services are defined and functional
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_systemd_unit.yaml"
      loop:
        # rhel installed services have service units defiend via rpm in
        # /usr/lib/systemd/system so disable the check for them them in
        # /etc/systemd/system
        - {"name": "virtlogd.service", "osp_service": false, "enabled": "enabled"}
        - {"name": "virtnodedevd.service" , "osp_service": false, "enabled": "enabled", "active": ["active", "inactive"]}
        - {"name": "virtproxyd.service", "osp_service": false, "enabled": "enabled", "active": ["active", "inactive"]}
        - {"name": "virtqemud.service", "osp_service": false, "enabled": "enabled", "active": ["active", "inactive"]}
        - {"name": "virtsecretd.service", "osp_service": false, "enabled": "enabled", "active": ["active", "inactive"]}
        - {"name": "libvirtd.service", "osp_service": false, "enabled": "masked", "active": ["inactive"]}
        - {"name": "libvirtd-tcp.socket", "osp_service": false, "enabled": "masked", "active": ["inactive"]}
        - {"name": "libvirtd-tls.socket", "osp_service": false, "enabled": "masked", "active": ["inactive"]}
        - {"name": "virtproxyd-tcp.socket", "osp_service": false, "enabled": "masked", "active": ["inactive"]}

    - name: ensure libvirt.target exist and are running
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_systemd_unit.yaml"
      loop:
        - {"name": "edpm_libvirt.target", "enabled": "static"}
        - {"name": "edpm_libvirt_guests.service", "running":false}
        - {"name": "virt-guest-shutdown.target", "enabled": "static", "running":false}
    - name: Check if user exists
      ansible.builtin.getent:
        database: passwd
        key: libvirt
      register: libvirt_user

    - name: validate tls with virt-pki-validate
      become: true
      ansible.builtin.shell: "virt-pki-validate"
      register: virt_pki_validate
      failed_when: false
    - name: Print virt-pki-validate output
      debug:
        msg: "{{ virt_pki_validate.stdout }}"
    - name: Test result of virt-pki-validate
      block:
        - name: Assert that virt-pki-validate returns no errors
          assert:
            that: "{{ 'FAIL' not in virt_pki_validate.stdout }}"
      when: virt_pki_validate.rc != 0

    - name: ensure we can connect to libvirt with virsh via tls
      # Note we need become because the client cert is owned by root
      become: true
      ansible.builtin.command: "virsh -c qemu+tls://{{ inventory_hostname }}/system version"
      register: virsh_tls
      failed_when: virsh_tls.rc != 0
    - name: Assert that libvirt user is created with kolla uid and gid
      ansible.builtin.assert:
        that:
          # user
          - "libvirt_user.ansible_facts.getent_passwd.libvirt[1] == '42473'"
          # group
          - "libvirt_user.ansible_facts.getent_passwd.libvirt[2] == '42473'"
    - name: ensure libvirt sockets are enabled
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_systemd_unit.yaml"
      loop:
        - {"name": "virtlogd-admin.socket", "osp_service": false}
        - {"name": "virtlogd.socket", "osp_service": false}
        - {"name": "virtnodedevd-admin.socket", "osp_service": false}
        - {"name": "virtnodedevd-ro.socket", "osp_service": false}
        - {"name": "virtnodedevd.socket", "osp_service": false}
        - {"name": "virtproxyd-admin.socket", "osp_service": false}
        - {"name": "virtproxyd-ro.socket", "osp_service": false}
        - {"name": "virtproxyd.socket", "osp_service": false}
        - {"name": "virtqemud-admin.socket", "osp_service": false}
        - {"name": "virtqemud-ro.socket", "osp_service": false}
        - {"name": "virtqemud.socket", "osp_service": false}
        - {"name": "virtsecretd-admin.socket", "osp_service": false}
        - {"name": "virtsecretd-ro.socket", "osp_service": false}
        - {"name": "virtsecretd.socket", "osp_service": false}

    - name: ensure libvirt socket activation drop-in directories exist
      ansible.builtin.include_tasks: "{{test_helper_dir}}/verify_sockets_exits.yaml"
      loop:
        - {"path": "/run/libvirt/virtlogd-admin-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtlogd-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtnodedevd-admin-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtnodedevd-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtnodedevd-sock-ro", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtqemud-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtqemud-sock-ro", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtqemud-admin-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtsecretd-admin-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtsecretd-sock", "user": "root", "group": "libvirt" }
        - {"path": "/run/libvirt/virtsecretd-sock-ro", "user": "root", "group": "libvirt" }

    - name: ensure container_file_t selinux lable is not set on /run/libvirt
      ansible.builtin.shell: "ls -lZ /run/libvirt | grep container_file_t"
      register: run_libvirt
      failed_when: run_libvirt.rc not in [0, 1]
    - name: Assert that container_file_t selinux lable is not set on /run/libvirt
      ansible.builtin.assert:
        that:
          - "run_libvirt.rc != 0"

    - name: Load /etc/libvirt/qemu.conf
      become: true
      ansible.builtin.slurp:
        src: /etc/libvirt/qemu.conf
      register: qemu_conf
    - name: Assert that qemu.conf has a proper migration port range
      assert:
        that:
          - "'migration_port_min = 61152' in qemu_conf.content | b64decode"
          - "'migration_port_max = 61215' in qemu_conf.content | b64decode"

    - name: Load os_enabled_vtpm selinux boolean
      ansible.builtin.shell: "getsebool os_enable_vtpm"
      register: os_enabled_vtpm
    - name: Assert that os_enabled_vtpm selinux boolean is enabled
      assert:
        that:
          - "os_enabled_vtpm.stdout_lines[0] == 'os_enable_vtpm --> on'"

    - name: ensure ceph secret is configured
      ansible.builtin.include_tasks: "test-helpers/verify_ceph_secret.yaml"

    - name: Load /etc/libvirt/auth.conf
      become: true
      ansible.builtin.slurp:
        src: /etc/libvirt/auth.conf
      register: libvirt_auth_conf
    - name: Assert that libvirt auth password is set
      assert:
        that:
          - "'password=correct horse battery staple' in libvirt_auth_conf.content | b64decode | split('\n')"

    - name: Get sasl users
      become: true
      ansible.builtin.command:
        cmd: sasldblistusers2 -f /etc/libvirt/passwd.db
      register: saslusers
    - name: Assert that libvirt sasl user exists
      assert:
        that:
          - "'migration@openstack: userPassword' in saslusers.stdout_lines"

    - name: Gather distribution fact
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - "distribution"
    - name: Expected owner for confined virtproxyd configs
      ansible.builtin.set_fact:
        edpm_libvirt_confined_conf_owner: "{{ 'root' if ansible_facts['distribution_major_version'] is version('10', '>=') else 'libvirt' }}"
    - name: Stat templated libvirt config files
      become: true
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: libvirt_conf_stat
      loop:
        - {"path": "/etc/libvirt/virtproxyd.conf", "owner": "{{ edpm_libvirt_confined_conf_owner }}"}
        - {"path": "/etc/libvirt/virtnodedevd.conf", "owner": "{{ edpm_libvirt_confined_conf_owner }}"}
        - {"path": "/etc/libvirt/virtsecretd.conf", "owner": "{{ edpm_libvirt_confined_conf_owner }}"}
        - {"path": "/etc/sasl2/libvirt.conf", "owner": "{{ edpm_libvirt_confined_conf_owner }}"}
        - {"path": "/etc/libvirt/virtlogd.conf", "owner": "libvirt"}
        - {"path": "/etc/libvirt/virtqemud.conf", "owner": "libvirt"}
        - {"path": "/etc/libvirt/qemu.conf", "owner": "libvirt"}
        - {"path": "/etc/libvirt/auth.conf", "owner": "libvirt"}
    - name: Assert libvirt config ownership
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == item.item.owner
        fail_msg: "{{ item.item.path }} is {{ item.stat.pw_name }}, expected {{ item.item.owner }}"
      loop: "{{ libvirt_conf_stat.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Load /etc/libvirt/virtproxyd.conf
      become: true
      ansible.builtin.slurp:
        src: /etc/libvirt/virtproxyd.conf
      register: virtproxyd_conf
    - name: Assert that sasl auth is configured
      assert:
        that:
          - "'auth_tls=\"sasl\"' in virtproxyd_conf.content | b64decode | split('\n')"
