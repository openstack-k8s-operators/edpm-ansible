- name: Check for legacy container_manage unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/edpm_ovn_metadata_agent.service"
  register: edpm_neutron_metadata_legacy_unit

# Stop while the unit file is still on disk so systemd runs the legacy
# ExecStop, and so the unit goes inactive and avoid any corrupt state
# in case of any interupt before the reload is triggered.
- name: Stop and disable legacy container_manage service
  become: true
  ansible.builtin.systemd:
    name: "edpm_ovn_metadata_agent.service"
    state: stopped
    enabled: false
  when: edpm_neutron_metadata_legacy_unit.stat.exists

# Remove the old container_manage unit from /etc/systemd/system/ so it does not
# shadow the Quadlet-generated unit in /run/systemd/generator/ (systemd
# precedence).
- name: Remove legacy container_manage unit that shadows Quadlet
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/edpm_ovn_metadata_agent.service"
    state: absent

- name: Redeploy Neutron metadata service after upgrade tasks
  ansible.builtin.include_tasks:
    file: run.yml
    apply:
      become: true
      tags:
        - edpm_neutron_metadata
        - edpm_upgrade_services
  tags:
    - edpm_neutron_metadata
    - edpm_upgrade_services
