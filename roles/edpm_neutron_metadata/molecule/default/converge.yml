- name: Converge
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - ansible.builtin.include_role:
        name: "osp.edpm.edpm_neutron_metadata"
      vars:
        tenant_ip: "{{ ansible_host }}"
        edpm_ovn_dbs:
          - "{{ ansible_host }}"
        edpm_neutron_metadata_config_src: "{{lookup('env', 'MOLECULE_SCENARIO_DIRECTORY')}}/test-data"
        edpm_neutron_metadata_agent_sidecar_debug: true
        edpm_neutron_metadata_unbound_conf_src: /tmp/ovn-metadata-unbound.conf
        edpm_neutron_metadata_unbound_conf_content: |
          server:
              cache-max-negative-ttl: 0

    - name: Verify ovn_metadata_agent Unbound configuration is passed to the container
      become: true
      block:
        - name: Read installed Unbound configuration
          ansible.builtin.slurp:
            src: /tmp/ovn-metadata-unbound.conf
          register: _ovn_metadata_unbound_conf

        - name: Verify installed Unbound configuration content
          ansible.builtin.assert:
            that:
              - "'cache-max-negative-ttl: 0' in (_ovn_metadata_unbound_conf.content | b64decode)"

        - name: Read ovn_metadata_agent startup configuration
          ansible.builtin.slurp:
            src: /var/lib/edpm-config/container-startup-config/ovn_metadata_agent/ovn_metadata_agent.json
          register: _ovn_metadata_startup_config

        - name: Decode ovn_metadata_agent startup configuration
          ansible.builtin.set_fact:
            _ovn_metadata_startup_config_json: "{{ _ovn_metadata_startup_config.content | b64decode | from_json }}"

        - name: Verify Unbound environment and mount
          ansible.builtin.assert:
            that:
              - _ovn_metadata_startup_config_json.environment.OVS_UNBOUND_CONF == '/etc/unbound/ovn-metadata.conf'
              - "'/tmp/ovn-metadata-unbound.conf:/etc/unbound/ovn-metadata.conf:ro,z' in _ovn_metadata_startup_config_json.volumes"
