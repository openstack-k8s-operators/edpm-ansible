---
- name: Prepare
  hosts: all
  roles:
    - role: ../../../../molecule/common/test_deps
    - role: env_data
  tasks:
    # el10 NVIDIA kmods are DKMS-only and the download path never adds EPEL itself,
    # so dkms must be resolvable before nvidia-open can be downloaded.
    - name: Add EPEL repository for dkms
      become: true
      ansible.builtin.yum_repository:
        name: epel
        description: EPEL YUM repo
        baseurl: "https://download.fedoraproject.org/pub/epel/{{ ansible_facts['distribution_major_version'] }}/Everything/$basearch/"
        gpgcheck: true
        gpgkey: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"

    - name: Install rpm-build package
      become: true
      ansible.builtin.package:
        name: rpm-build
        state: present

    - name: Copy spec file into system under test
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') | regex_replace('_vagrant$', '') }}/test_package/mock-amd-driver.spec"
        dest: /tmp/mock-amd-driver.spec
        mode: '0644'

    - name: Build mock amd driver RPM
      ansible.builtin.command:
        cmd: rpmbuild -bb mock-amd-driver.spec
        chdir: /tmp
