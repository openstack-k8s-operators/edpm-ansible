---
- name: Converge
  hosts: all
  tasks:
    - name: Test download_cache.yml entry point
      ansible.builtin.include_role:
        name: "edpm_accel_drivers"
        tasks_from: download_cache.yml
      vars:
        edpm_accel_drivers:
          cache:
            path: /var/cache/accel-drivers
          vendors:
            nvidia_gpu:
              enabled: true
              repo:
                url: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/"
                gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/$basearch/CDF6BA43.pub"
                # rhel10 CUDA repo publishes no modulemd, so no module stream can be
                # enabled. Its kmods are DKMS-only, which is why EPEL is added in prepare.yml.
                module_stream: ""
                package_name: "nvidia-open"
            amd_gpu:
              enabled: true
              custom_url:
                url: "file:///tmp/mock-amd-driver.rpm"
                disable_gpg_check: true
