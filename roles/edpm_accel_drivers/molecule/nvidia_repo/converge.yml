---
- name: Converge
  hosts: all
  roles:
    - role: "edpm_accel_drivers"
      vars:
        edpm_accel_drivers:
          vendors:
            nvidia_gpu:
              enabled: true
              repo:
                url: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/"
                gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/$basearch/CDF6BA43.pub"
                # rhel10 CUDA repo publishes no modulemd, so no module stream can be
                # enabled. Its kmods are DKMS-only, which is why EPEL is added in prepare.yml.
                module_stream: ""
                package_name: "nvidia-open"
