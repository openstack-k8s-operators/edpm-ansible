---
dependency:
  name: galaxy
driver:
  name: delegated
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: compute-1
    groups:
      - compute
provisioner:
  name: ansible
  playbooks:
    prepare: ../nvidia_mig/prepare.yml
    converge: ../nvidia_mig/converge.yml
    verify: ../nvidia_mig/verify.yml
    cleanup: ../nvidia_mig/cleanup.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
