---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Read kernel version saved by prepare
      ansible.builtin.slurp:
        src: /tmp/test-kernel-version
      register: _verify_kernel_version_raw

    - name: Set kernel version fact
      ansible.builtin.set_fact:
        test_kernel_version: "{{ (_verify_kernel_version_raw.content | b64decode).strip() }}"

    - name: Read dnf.conf
      ansible.builtin.slurp:
        src: /etc/dnf/dnf.conf
      register: _verify_dnf_conf

    - name: Parse exclude line from dnf.conf
      ansible.builtin.set_fact:
        _verify_dnf_excludes: >-
          {%- set match = ((_verify_dnf_conf.content | b64decode) | regex_search('^exclude=(.*)$', '\\1', multiline=True)) -%}
          {%- if match -%}
            {{ match[0].split(',') | map('trim') | list }}
          {%- else -%}
            []
          {%- endif -%}

    - name: Verify kernel packages are excluded in dnf.conf
      ansible.builtin.assert:
        that:
          - "'kernel' in _verify_dnf_excludes"
          - "'kernel-core' in _verify_dnf_excludes"
          - "'kernel-modules' in _verify_dnf_excludes"
        fail_msg: "dnf.conf exclude line does not contain all required kernel packages: {{ _verify_dnf_excludes }}"

    - name: Verify grubby default kernel was set
      become: true
      ansible.builtin.command:
        cmd: grubby --default-kernel
      register: _verify_default_kernel
      changed_when: false

    - name: Verify default kernel contains target version
      ansible.builtin.assert:
        that: "test_kernel_version in _verify_default_kernel.stdout"
        fail_msg: "Default kernel is '{{ _verify_default_kernel.stdout }}', expected {{ test_kernel_version }}"
