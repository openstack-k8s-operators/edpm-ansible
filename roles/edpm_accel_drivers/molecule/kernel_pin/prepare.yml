---
- name: Prepare
  hosts: all
  roles:
    - role: ../../../../molecule/common/test_deps
    - role: env_data
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: rpm

    - name: Determine current kernel version
      ansible.builtin.set_fact:
        current_kernel_version: >-
          {%- if 'kernel-core' in ansible_facts.packages -%}
            {{ ansible_facts.packages['kernel-core'][0].version }}-{{ ansible_facts.packages['kernel-core'][0].release }}
          {%- elif 'kernel' in ansible_facts.packages -%}
            {{ ansible_facts.packages['kernel'][0].version }}-{{ ansible_facts.packages['kernel'][0].release }}
          {%- else -%}
            {{ ansible_kernel | regex_replace('\.(x86_64|aarch64)$', '') }}
          {%- endif -%}

    - name: Query dnf for all available kernel packages
      become: true
      ansible.builtin.dnf:
        list: kernel
      register: _dnf_kernels

    - name: List all available kernel versions
      ansible.builtin.set_fact:
        available_kernel_versions: >-
          {{ _dnf_kernels.results
             | selectattr('yumstate', 'equalto', 'available')
             | selectattr('name', 'equalto', 'kernel')
             | map(attribute='nevra')
             | map('regex_replace', '^\d+:', '')
             | map('regex_replace', '\.(x86_64|aarch64|noarch)$', '')
             | map('regex_replace', '^kernel-', '')
             | unique | sort | reverse | list }}

    - name: Select a random target kernel version
      ansible.builtin.set_fact:
        test_kernel_version: >-
          {%- set other_kernels = available_kernel_versions | reject('equalto', current_kernel_version) | list -%}
          {%- if other_kernels | length > 0 -%}
            {{ other_kernels | random }}
          {%- else -%}
            {{ current_kernel_version }}
          {%- endif -%}

    - name: Save kernel version to file for converge to read
      ansible.builtin.copy:
        content: "{{ test_kernel_version }}"
        dest: /tmp/test-kernel-version
        mode: '0644'

    - name: Report selected kernel for testing
      ansible.builtin.debug:
        msg: "Current kernel: {{ current_kernel_version }}, Target kernel: {{ test_kernel_version }}"

    - name: Make sure grubby is installed
      become: true
      ansible.builtin.dnf:
        name: grubby
        state: present
