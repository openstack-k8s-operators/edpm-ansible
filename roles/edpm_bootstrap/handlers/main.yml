---

- name: Setup linux swap area on file if needed
  become: true
  ansible.builtin.command: mkswap "{{ edpm_bootstrap_swap_path_value }}"
  register: _mkswap_command
  changed_when: _mkswap_command.rc == 0
  failed_when: _mkswap_command.rc != 0
  listen: "create and activate swap"

- name: Activate swap
  become: true
  ansible.builtin.command: swapon "{{ edpm_bootstrap_swap_path_value }}"
  register: _swapon_command
  changed_when: _swapon_command.rc == 0
  failed_when: _swapon_command.rc != 0
  listen: "create and activate swap"

- name: Run update-ca-trust
  become: true
  ansible.builtin.command: /usr/bin/update-ca-trust
  register: _trust_cmd
  changed_when: _trust_cmd.rc == 0
  failed_when: _trust_cmd.rc != 0
  listen: "update-ca-trust"

# Reload, not restart, to avoid dropping the Ansible SSH connection.
- name: Reload sshd to apply crypto-policy
  become: true
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  listen: "reload sshd for crypto-policy"
  when:
    - ansible_facts.services is defined
    - "'sshd.service' in ansible_facts.services"
    - ansible_facts.services['sshd.service'].state == 'running'
