- name: Check FRR-OVN BindsTo drop-ins
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/system/edpm_frr.service.d/ovn-bind.conf
    - /etc/systemd/system/edpm_ovn_controller.service.d/frr-bind.conf
  register: _edpm_frr_ovn_dropins

- name: Assert both drop-ins have the expected state
  ansible.builtin.assert:
    that:
      - item.stat.exists == (_edpm_frr_ovn_expect_bindings | bool)
    fail_msg: "Unexpected binding state for {{ item.item }}"
  loop: "{{ _edpm_frr_ovn_dropins.results }}"
  loop_control:
    label: "{{ item.item }}"
