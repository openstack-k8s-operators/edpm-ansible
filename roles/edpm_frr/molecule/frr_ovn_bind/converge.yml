- name: Converge
  hosts: all
  gather_facts: false
  become: true
  vars:
    edpm_download_cache_podman_auth_file: ""
    edpm_frr_ovn_bind: true
    edpm_frr_bgp_peers:
      - 10.64.0.1
    tenant_ip: "{{ ansible_host }}"
    edpm_ovn_dbs:
      - "{{ ansible_host }}"
    edpm_ovn_config_src: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/test-data"
    _edpm_frr_ovn_test_services:
      edpm_frr: edpm_frr.service
      edpm_ovn: edpm_ovn_controller.service
  tasks:
    - name: Download FRR role packages
      ansible.builtin.include_role:
        name: "osp.edpm.edpm_frr"
        tasks_from: "download_cache.yml"

    - name: Deploy first role without its peer
      ansible.builtin.include_role:
        name: "osp.edpm.{{ edpm_frr_ovn_bind_role_order[0] }}"

    - name: Verify first service runs without its peer
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ _edpm_frr_ovn_test_services[edpm_frr_ovn_bind_role_order[0]] }}"
      register: _first_service_status
      changed_when: false
      until: _first_service_status.stdout == 'active'
      retries: 10
      delay: 1

    - name: Verify binding is deferred until the peer is deployed
      ansible.builtin.include_tasks: verify_dropins.yml
      vars:
        _edpm_frr_ovn_expect_bindings: false

    - name: Deploy second role with BindsTo enabled
      ansible.builtin.include_role:
        name: "osp.edpm.{{ edpm_frr_ovn_bind_role_order[1] }}"

    - name: Verify both bindings exist after the second role runs
      ansible.builtin.include_tasks: verify_dropins.yml
      vars:
        _edpm_frr_ovn_expect_bindings: true
