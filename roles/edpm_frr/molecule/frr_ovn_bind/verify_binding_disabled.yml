- name: Disable binding through {{ _edpm_frr_ovn_test_role }}
  ansible.builtin.include_role:
    name: "osp.edpm.{{ _edpm_frr_ovn_test_role }}"
    tasks_from: run.yml
  vars:
    edpm_frr_ovn_bind: false

- name: Verify disabling binding removes both drop-ins
  ansible.builtin.include_tasks: verify_dropins.yml
  vars:
    _edpm_frr_ovn_expect_bindings: false

- name: Re-enable binding through {{ _edpm_frr_ovn_test_role }}
  ansible.builtin.include_role:
    name: "osp.edpm.{{ _edpm_frr_ovn_test_role }}"
    tasks_from: run.yml
  vars:
    edpm_frr_ovn_bind: true

- name: Verify re-enabling binding restores both drop-ins
  ansible.builtin.include_tasks: verify_dropins.yml
  vars:
    _edpm_frr_ovn_expect_bindings: true
