# All variables intended for modification should be placed in this file.

# All variables within this role should have a prefix of "edpm_leapp_upgrade"

# Run the EDPM pre-flight validation phase
edpm_leapp_upgrade_validate: true

# Run the leapp pre-upgrade analysis (infra.leapp.analysis). Also decides
# whether infra.leapp.upgrade requires the analysis report to be present.
edpm_leapp_upgrade_analysis: true

# Fail the run when the pre-upgrade analysis reports inhibitors
edpm_leapp_upgrade_fail_on_inhibitors: true

# Minimum source RHEL major version eligible for the upgrade
edpm_leapp_upgrade_source_major_version: "9"

# Minimum source RHEL minor version eligible for the upgrade
edpm_leapp_upgrade_source_min_version: "9.6"

# Archive a stale /var/log/leapp/ansible_leapp_*.log left behind by an
# aborted run. The upstream roles refuse to start while such a log exists.
edpm_leapp_upgrade_clean_stale_logs: true

# Enable a Copr repository on the node before infra.leapp installs the leapp
# packages. infra.leapp has no Copr support of its own: it installs
# leapp-upgrade from whatever repositories are already enabled, so the Copr
# has to be in place before the analysis phase runs.
edpm_leapp_upgrade_copr_enabled: false

# Copr project to enable, in "owner/project" form. Group projects keep their
# leading "@", as in the "dnf copr enable" argument.
edpm_leapp_upgrade_copr_project: "@oamg/leapp"

# Copr chroot to pull the builds from. RHEL is not a Copr chroot, so
# "dnf copr enable @oamg/leapp" fails on RHEL unless the chroot is given
# explicitly; the EPEL chroot matching the source RHEL major version is the
# one to use. Note that @oamg/leapp only builds for epel-7, epel-8 and
# epel-9, so this has to stay pinned to the source OS, not the target.
edpm_leapp_upgrade_copr_chroot: >-
  epel-{{ ansible_facts['distribution_major_version'] }}-$basearch

# Remove the Copr repository again once infra.leapp.upgrade has finished, so
# that an EPEL 9 Copr is not left configured on an upgraded RHEL 10 node.
edpm_leapp_upgrade_copr_remove_after_upgrade: true

# Forwarded to infra.leapp as leapp_copy_reports
edpm_leapp_upgrade_copy_reports: true

# Forwarded to infra.leapp as leapp_workdir_controller; collected reports
# are written here on the controller.
# Upstream defaults this to {{ playbook_dir }}, which in EDPM resolves inside
# the collection mounted read-only in the AnsibleEE pod
# (/usr/share/ansible/collections/ansible_collections/osp/edpm/playbooks), so
# the report copy fails with EROFS. Default to the runner home instead, which
# is writable by the (arbitrary) UID the pod runs as.
edpm_leapp_upgrade_workdir_controller: >-
  {{ [lookup('ansible.builtin.env', 'HOME') | default('/tmp', true),
      'edpm_leapp_reports'] | ansible.builtin.path_join }}
