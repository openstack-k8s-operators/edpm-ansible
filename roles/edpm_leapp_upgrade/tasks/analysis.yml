# ============================================================================
# Leapp OS Upgrade - Analysis Phase
# ============================================================================

- name: Run leapp pre-upgrade analysis
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'EDPM_LEAPP_COLLECTION', default='infra.leapp') + '.analysis' }}"
    apply:
      become: true
  vars:
    leapp_system_roles_collection: "{{ lookup('ansible.builtin.env', 'EDPM_SYSTEMROLES', default='fedora.linux_system_roles') }}"
    leapp_copy_reports: "{{ edpm_leapp_upgrade_copy_reports }}"
    leapp_workdir_controller: >-
      {{ _edpm_leapp_workdir_controller | default(edpm_leapp_upgrade_workdir_controller, true) }}
    # The generated host_vars/ and remediation playbook are written to the
    # controller, which is an ephemeral AnsibleEE pod in EDPM, and the
    # remediate role is not part of this workflow.
    leapp_create_remediation_hostvars: false

- name: Fail when leapp analysis reported upgrade inhibitors
  ansible.builtin.assert:
    that:
      - not upgrade_inhibited
    fail_msg: >-
      Leapp pre-upgrade analysis found inhibitors. Review the report at
      /var/log/leapp/leapp-report.txt on the node, remediate, and re-run.
  when: edpm_leapp_upgrade_fail_on_inhibitors
