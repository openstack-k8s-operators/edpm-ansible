# ============================================================================
# Leapp OS Upgrade - Copr Repository
# ============================================================================
#
# Equivalent of "dnf copr enable @oamg/leapp epel-<n>-x86_64", written
# directly as a repository file instead of shelling out to the dnf Copr
# plugin: it avoids the dnf-plugins-core dependency, it is idempotent, and it
# sidesteps the chroot guessing of the plugin, which derives "rhel-<n>" from
# /etc/os-release and fails because @oamg/leapp has no RHEL chroot.
#
# This has to run before infra.leapp, which installs leapp-upgrade from
# whatever repositories are already enabled on the node.

- name: Gather distribution facts if needed
  when: "'distribution_major_version' not in ansible_facts"
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "distribution"

- name: Import the GPG key of Copr project {{ edpm_leapp_upgrade_copr_project }}
  become: true
  ansible.builtin.rpm_key:
    key: "{{ _edpm_leapp_copr_gpgkey }}"
    state: present

- name: Enable Copr project {{ edpm_leapp_upgrade_copr_project }}
  become: true
  ansible.builtin.yum_repository:
    name: "{{ _edpm_leapp_copr_id }}"
    file: "{{ _edpm_leapp_copr_file }}"
    description: "Copr repo for {{ _edpm_leapp_copr_name }} owned by {{ _edpm_leapp_copr_owner }}"
    baseurl: "{{ _edpm_leapp_copr_baseurl }}"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ _edpm_leapp_copr_gpgkey }}"
    repo_gpgcheck: false
    # Mirrors the repository file published by Copr. An unreachable Copr
    # therefore does not fail the run, it falls back to the distribution
    # build of leapp-upgrade.
    skip_if_unavailable: true
    state: present
    owner: root
    group: root
    mode: "0644"
