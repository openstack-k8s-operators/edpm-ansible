# ============================================================================
# Leapp OS Upgrade - Main Task
# ============================================================================

# Tagged 'always' because both the analysis and the upgrade phase copy their
# reports to this directory, so it has to be resolved whichever phase is
# selected with --tags.
- name: Resolve the controller directory for leapp reports
  ansible.builtin.include_tasks:
    file: controller-workdir.yml
    apply:
      tags:
        - always
  when: edpm_leapp_upgrade_copy_reports | bool
  tags:
    - always

- name: Validate EDPM leapp upgrade prerequisites
  ansible.builtin.include_tasks:
    file: pre-validate.yml
    apply:
      tags:
        - leapp_validate
  when: edpm_leapp_upgrade_validate
  tags:
    - leapp_validate

# Both infra.leapp.analysis and infra.leapp.upgrade install leapp-upgrade
# from the repositories enabled on the node, so the Copr has to be in place
# for either phase.
- name: Enable the leapp Copr repository
  ansible.builtin.include_tasks:
    file: copr.yml
    apply:
      tags:
        - leapp_analysis
        - leapp_run
  when: edpm_leapp_upgrade_copr_enabled | bool
  tags:
    - leapp_analysis
    - leapp_run

- name: Run leapp pre-upgrade analysis
  ansible.builtin.include_tasks:
    file: analysis.yml
    apply:
      tags:
        - leapp_analysis
  when: edpm_leapp_upgrade_analysis
  tags:
    - leapp_analysis

- name: Run leapp in-place upgrade
  ansible.builtin.include_tasks:
    file: upgrade.yml
    apply:
      tags:
        - leapp_run
  tags:
    - leapp_run
