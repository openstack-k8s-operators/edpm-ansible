# ============================================================================
# Leapp OS Upgrade - Upgrade Phase
# ============================================================================

- name: Run leapp in-place OS upgrade
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'EDPM_LEAPP_COLLECTION', default='infra.leapp') + '.upgrade' }}"
    apply:
      become: true
  vars:
    leapp_system_roles_collection: "{{ lookup('ansible.builtin.env', 'EDPM_SYSTEMROLES', default='fedora.linux_system_roles') }}"
    # Only require the pre-upgrade analysis report when the analysis phase
    # of this role actually ran; infra.leapp.upgrade fails hard on a
    # missing report when leapp_check_analysis_results is true.
    leapp_check_analysis_results: "{{ edpm_leapp_upgrade_analysis }}"
    leapp_copy_reports: "{{ edpm_leapp_upgrade_copy_reports }}"
    leapp_workdir_controller: >-
      {{ _edpm_leapp_workdir_controller | default(edpm_leapp_upgrade_workdir_controller, true) }}

# The chroot is pinned to the source RHEL major version, so leaving the
# repository behind would point an EPEL 9 Copr at an upgraded RHEL 10 node.
# Removal is by repository id and file name only, both of which are
# independent of the chroot and so still resolve after the upgrade.
- name: Remove the leapp Copr repository after the upgrade
  become: true
  ansible.builtin.yum_repository:
    name: "{{ _edpm_leapp_copr_id }}"
    file: "{{ _edpm_leapp_copr_file }}"
    state: absent
  when:
    - edpm_leapp_upgrade_copr_enabled | bool
    - edpm_leapp_upgrade_copr_remove_after_upgrade | bool
