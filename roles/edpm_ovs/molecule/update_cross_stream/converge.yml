- name: Converge
  hosts: all
  vars:
    ovs_target_packages: "{{ (molecule_yml['provisioner']['env']['ovs_target_packages']).split(',') }}"
  tasks:
    - name: set bootc fact
      set_fact:
        ansible_local:
          bootc: false
    - name: Call openvswitch update role to swap to a different ovs stream without the wrapper package
      ansible.builtin.import_role:
        name: osp.edpm.edpm_ovs
        tasks_from: update
      vars:
        # prepare installed ovs_pre_update_version (an older FDP stream, e.g.
        # openvswitch3.1). This exercises updating across FDP streams (which
        # Conflict with, rather than Obsolete, each other) directly via
        # edpm_ovs_packages/dnf --allowerasing, with no rdo-openvswitch/
        # rhoso-openvswitch wrapper package involved.
        edpm_ovs_packages: "{{ ovs_target_packages }}"
