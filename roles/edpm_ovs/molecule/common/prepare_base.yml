- name: Enable package repos
  become: true
  ansible.builtin.shell: |
    set -euxo pipefail
    pushd /var/tmp
    curl -sL https://github.com/openstack-k8s-operators/repo-setup/archive/refs/heads/main.tar.gz | tar -xz
    pushd repo-setup-main
    python3 -m venv ./venv
    PBR_VERSION=0.0.0 ./venv/bin/pip install ./
    ./venv/bin/repo-setup -d centos10 current -b master
    popd
    rm -rf repo-setup-main
- name: Exclude legacy openvswitch wrapper package from dnf resolution
  become: true
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    line: exclude=rdo-openvswitch
  # The RDO repos enabled above still carry the rdo-openvswitch wrapper
  # package, which Obsoletes every openvswitchN.N stream package. Left
  # unexcluded, dnf's default obsoletes handling would silently substitute
  # it (and whichever stream it depends on) in place of the edpm_ovs role's
  # concrete stream package installs/updates, which this test environment
  # is not meant to exercise.
- name: set /etc/localtime
  become: true
  ansible.builtin.file:
    path: /etc/localtime
    src: /usr/share/zoneinfo/UTC
    state: link
- name: set timezone
  ansible.builtin.import_role:
    name: osp.edpm.edpm_timezone
- name: "Include edpm_users with non default config"
  ansible.builtin.include_role:
    name: "osp.edpm.edpm_users"
  vars:
    edpm_users_users:
      - {"name": "hugetlbfs", "gid": "42477", "group_only": true}
    edpm_users_extra_dirs: []
