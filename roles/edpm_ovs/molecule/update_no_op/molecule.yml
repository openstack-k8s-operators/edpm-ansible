---
dependency:
  name: galaxy
driver:
  name: delegated
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: compute-1
    groups:
      - compute
provisioner:
  log: true
  name: ansible
  env:
    # Left unset so prepare installs using the role's own default
    # edpm_ovs_version/edpm_ovs_packages, matching what converge updates to,
    # so no update should occur.
    ovs_pre_update_version: ""
  playbooks:
    prepare: "../common/update/prepare.yml"
    verify: "../common/update/verify.yml"
    cleanup: ../common/update/cleanup.yml
scenario:
  name: update_no_op
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
