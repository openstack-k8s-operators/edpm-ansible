---
dependency:
  name: galaxy
driver:
  name: delegated
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: compute-1
    groups:
      - compute
provisioner:
  log: true
  name: ansible
  env:
    # Must be older than the role's default edpm_ovs_version so that
    # converge's update to the default actually has something to do -
    # otherwise the update check finds no changes, the update block (and the
    # reload task nested inside it) never runs, and the "reloaded" assertion
    # in verify.yml would fail since the service was never touched.
    ovs_pre_update_version: "openvswitch3.4"
  playbooks:
    prepare: "../common/update/prepare.yml"
    verify: "../common/update/verify.yml"
    cleanup: ../common/update/cleanup.yml
scenario:
  name: update_with_reload
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
