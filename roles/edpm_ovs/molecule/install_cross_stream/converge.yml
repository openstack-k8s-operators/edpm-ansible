---
- name: Converge
  hosts: all
  pre_tasks:
    - name: set basic user fact
      ansible.builtin.set_fact:
        ansible_user: "{{ lookup('env', 'USER') }}"
      when:
        - ansible_user is undefined

    - name: set basic home fact
      ansible.builtin.set_fact:
        ansible_user_dir: "{{ lookup('env', 'HOME') }}"
      when:
        - ansible_user_dir is undefined

    - name: set bootc fact
      ansible.builtin.set_fact:
        ansible_local:
          bootc: false

  roles:
    # No edpm_ovs_packages override here: this exercises the role's
    # default edpm_ovs_packages (the current default stream, e.g.
    # openvswitch3.5), converging from the older stream installed during
    # prepare via the normal install path (main.yml -> install.yml), not
    # the dedicated update task.
    - role: osp.edpm.edpm_ovs
