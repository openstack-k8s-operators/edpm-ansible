- name: Prepare
  hosts: all
  become: true
  vars:
    ovs_pre_install_version: "{{ molecule_yml['provisioner']['env']['ovs_pre_install_version'] }}"
  pre_tasks:
    - name: Include base pre_tasks
      ansible.builtin.include_tasks:
        file: ../common/prepare_pre_tasks.yml
  tasks:
    - name: Include base prepare tasks
      ansible.builtin.include_tasks:
        file: ../common/prepare_base.yml

    # Simulates a host that was previously installed/updated with an older
    # edpm_ovs_version default (e.g. openvswitch3.3), before converging
    # below with the role's current default edpm_ovs_packages (a newer
    # stream such as openvswitch3.5).
    - name: Import edpm_ovs role to install an older ovs stream before converge
      ansible.builtin.import_role:
        name: osp.edpm.edpm_ovs
      vars:
        edpm_ovs_packages:
          - "{{ ovs_pre_install_version }}"
