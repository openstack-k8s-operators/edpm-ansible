# All variables intended for modification should be placed in this file.

# All variables within this role should have a prefix of "edpm_ovs"

# seconds between retries for download tasks
edpm_ovs_download_delay: "{{ edpm_download_delay | default(60) }}"
# number of retries for download tasks
edpm_ovs_download_retries: "{{ edpm_download_retries | default(5) }}"
# this sould map to the ovs
edpm_ovs_services:
  - openvswitch
edpm_ovs_packages:
  # The FDP openvswitch "stream" package to install/update to, selected
  # directly instead of going through the rdo-openvswitch/rhoso-openvswitch
  # wrapper package. Bump this whenever the platform's default OVS stream
  # changes.
  # NOTE: to pin an exact version (e.g. for adoption, to avoid an unwanted
  # upgrade), override with an exact NVR, e.g.:
  # edpm_ovs_packages:
  #   - openvswitch3.1-3.1.4-1.el9s
  - "openvswitch3.5"
# whether to reload the openvswitch service after an update is complete
edpm_ovs_reload_after_update: false
