---
- name: Gather ansible_local facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "local"
  when:
    - ansible_local is not defined

- name: Install ovs packages
  tags:
    - install
    - ovs
  become: true
  ansible.builtin.dnf:
    name: "{{ edpm_ovs_packages }}"
    state: present
    # edpm_ovs_packages names the concrete openvswitchN.N package(s)
    # directly rather than the rdo-openvswitch/rhoso-openvswitch wrapper
    # (see defaults/main.yml). Each stream Conflicts with every other
    # stream instead of Obsoleting it, so if an older stream is already
    # installed (e.g. a host updating from openvswitch3.3 to the new
    # openvswitch3.5 default), this install would otherwise fail to
    # resolve. allowerasing lets dnf erase the conflicting, previously
    # installed stream package(s) as part of this transaction; unlike
    # update.yml this path is not required to avoid a service
    # stop/disable, since the next task below ensures the service ends up
    # enabled and running regardless.
    allowerasing: true
  register: edpm_ovs_package_install
  until: edpm_ovs_package_install is succeeded
  retries: "{{ edpm_ovs_download_retries }}"
  delay: "{{ edpm_ovs_download_delay }}"
  when: ansible_local.bootc is not defined or not ansible_local.bootc

- name: Ensure ovs services are enabled and running
  tags:
    - install
    - ovs
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    enabled: true
    state: started
    masked: false
  loop: "{{ edpm_ovs_services }}"
