---
- name: Gather ansible_local facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "local"
  when:
    - ansible_local is not defined

- name: Install ovs packages
  tags:
    - install
    - ovs
  become: true
  when: ansible_local.bootc is not defined or not ansible_local.bootc
  block:
    - name: Install ovs packages
      ansible.builtin.dnf:
        name: "{{ edpm_ovs_packages }}"
        state: present
      register: edpm_ovs_package_install
      until: edpm_ovs_package_install is succeeded
      retries: "{{ edpm_ovs_download_retries }}"
      delay: "{{ edpm_ovs_download_delay }}"
  rescue:
    # Only reached when the plain install above fails: edpm_ovs_packages
    # names the concrete openvswitchN.N package(s) directly rather than
    # the rdo-openvswitch/rhoso-openvswitch wrapper (see defaults/main.yml),
    # and each stream Conflicts with every other stream instead of
    # Obsoleting it, so installing on a host with an older stream already
    # present (e.g. openvswitch3.3) fails to resolve without erasing it.
    # Call dnf via the shell module (the ansible dnf module doesn't support
    # --setopt) to allow that erase via allowerasing, while disabling
    # scriptlets via noscripts so the erased package's %preun/%postun don't
    # stop/disable openvswitch.service and disrupt dependent services (e.g.
    # ovn-controller). The common fresh-install/same-stream case above never
    # reaches this rescue block, so its scriptlets keep running normally -
    # which matters, since e.g. the package's %post sets up
    # /run/openvswitch's ownership via tmpfiles.
    - name: Install ovs packages, erasing a conflicting older stream without running its scriptlets
      ansible.builtin.shell: >
        dnf install -y {{ " ".join(edpm_ovs_packages) }} --cacheonly --setopt=tsflags=noscripts --allowerasing
      register: edpm_ovs_package_install
      changed_when: edpm_ovs_package_install.rc == 0
      failed_when: edpm_ovs_package_install.rc != 0

- name: Ensure ovs services are enabled and running
  tags:
    - install
    - ovs
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    enabled: true
    state: started
    masked: false
  loop: "{{ edpm_ovs_services }}"
