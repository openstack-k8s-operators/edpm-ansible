- name: Determine if cacert file exists
  ansible.builtin.stat:
    path: "{{ edpm_telemetry_cacerts }}/tls-ca-bundle.pem"
  register: ca_bundle_stat_res

- name: Check that tls.crt exists
  ansible.builtin.stat:
    path: "{{ edpm_telemetry_certs }}/tls.crt"
  register: tls_crt_stat

- name: Check that tls.key exists
  ansible.builtin.stat:
    path: "{{ edpm_telemetry_certs }}/tls.key"
  register: tls_key_stat

- name: Create a directory for container health checks
  ansible.builtin.file:
    path: /var/lib/openstack/healthchecks
    state: directory
    setype: container_file_t
    owner: "{{ ansible_user | default(ansible_user_id) }}"
    group: "{{ ansible_user | default(ansible_user_id) }}"
    mode: '0755'
  become: true

- name: Start podman.socket service
  ansible.builtin.systemd_service:
    name: podman.socket
    state: started
    enabled: true
  become: true
  when: '"podman_exporter" in edpm_telemetry_enabled_exporters'

- name: Set role path for template resolution
  ansible.builtin.set_fact:
    _edpm_telemetry_role_path: "{{ role_path }}"

# The ceilometer polling agent quadlet applies the custom SELinux type
# ceilometer_polling_t, which is shipped by openstack-selinux. When that type is
# not in the loaded policy (e.g. openstack-selinux is not installed), podman/crun
# cannot transition into it and the container fails to start - regardless of
# enforcing/permissive mode. Detect the type so the option is only emitted when
# it is actually usable.
- name: Gather SELinux facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - selinux

- name: Check whether ceilometer_polling_t SELinux type is in the loaded policy
  ansible.builtin.command:
    cmd: >-
      python3 -c "import selinux, sys;
      sys.exit(0 if selinux.security_check_context('system_u:system_r:ceilometer_polling_t:s0') == 0 else 1)"
  register: _ceilometer_polling_type_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.selinux is defined
    - ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Decide whether ceilometer_polling_t confinement applies
  ansible.builtin.set_fact:
    edpm_telemetry_ceilometer_polling_type_available: >-
      {{ (ansible_facts.selinux.status | default('disabled') == 'enabled')
         and ((_ceilometer_polling_type_check.rc | default(1)) == 0) }}

# GPU access for ceilometer_agent_compute is all-or-nothing: it is only granted
# when the node has the NVML library, /dev/nvidiactl and at least one
# /dev/nvidiaN device (one per GPU, all of them are needed for NVML to report
# every GPU). Otherwise the node is assumed to have no NVIDIA GPU and the
# container is deployed without any GPU access.
- name: Discover NVIDIA GPU resources
  when: edpm_telemetry_ceilometer_gpu_enabled | bool
  block:
    - name: Check whether the NVML library is present
      ansible.builtin.stat:
        path: "{{ edpm_telemetry_ceilometer_gpu_nvml_library }}"
        follow: true
      register: _ceilometer_gpu_nvml_library_stat

    - name: Check whether /dev/nvidiactl is present
      ansible.builtin.stat:
        path: /dev/nvidiactl
      register: _ceilometer_gpu_nvidiactl_stat

    - name: Discover NVIDIA GPU device nodes
      ansible.builtin.find:
        paths: /dev
        patterns: '^nvidia[0-9]+$'
        use_regex: true
        file_type: any
      register: _ceilometer_gpu_devices_find

- name: Decide whether ceilometer_agent_compute gets GPU access
  ansible.builtin.set_fact:
    _edpm_telemetry_ceilometer_gpu_available: >-
      {{ (edpm_telemetry_ceilometer_gpu_enabled | bool)
         and (_ceilometer_gpu_nvml_library_stat.stat.exists | default(false))
         and (_ceilometer_gpu_nvidiactl_stat.stat.exists | default(false))
         and (_ceilometer_gpu_devices_find.files | default([]) | length > 0) }}
    _edpm_telemetry_ceilometer_gpu_devices: >-
      {{ ['/dev/nvidiactl']
         + (_ceilometer_gpu_devices_find.files | default([])
            | map(attribute='path') | sort) }}

- name: Report NVIDIA GPU access for ceilometer_agent_compute
  ansible.builtin.debug:
    msg: >-
      {{ 'Granting ceilometer_agent_compute access to ' ~
         (_edpm_telemetry_ceilometer_gpu_devices | join(', ')) ~ ' and ' ~
         edpm_telemetry_ceilometer_gpu_nvml_library
         if _edpm_telemetry_ceilometer_gpu_available | bool else
         'NVML library, /dev/nvidiactl or /dev/nvidiaN devices not found, '
         ~ 'deploying ceilometer_agent_compute without GPU access' }}
  when: edpm_telemetry_ceilometer_gpu_enabled | bool

- name: Deploy enabled exporters
  ansible.builtin.include_tasks:
    file: exporter.yml
  loop: "{{ edpm_telemetry_enabled_exporters }}"
  loop_control:
    loop_var: exporter

- name: List deployed health check scripts
  ansible.builtin.find:
    paths: /var/lib/openstack/healthchecks/
    file_type: directory
  register: deployed_hc
  become: true

- name: Correct health check scripts ownership based on container user IDs
  ansible.builtin.include_tasks:
    file: chown_healthcheck.yml
  loop: "{{ deployed_hc.files }}"
  loop_control:
    loop_var: hc_script
