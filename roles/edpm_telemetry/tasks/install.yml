- name: Determine if cacert file exists
  ansible.builtin.stat:
    path: "{{ edpm_telemetry_cacerts }}/tls-ca-bundle.pem"
  register: ca_bundle_stat_res

- name: Check that tls.crt exists
  ansible.builtin.stat:
    path: "{{ edpm_telemetry_certs }}/tls.crt"
  register: tls_crt_stat

- name: Check that tls.key exists
  ansible.builtin.stat:
    path: "{{ edpm_telemetry_certs }}/tls.key"
  register: tls_key_stat

- name: Create a directory for container health checks
  ansible.builtin.file:
    path: /var/lib/openstack/healthchecks
    state: directory
    setype: container_file_t
    owner: "{{ ansible_user | default(ansible_user_id) }}"
    group: "{{ ansible_user | default(ansible_user_id) }}"
    mode: '0755'
  become: true

- name: Start podman.socket service
  ansible.builtin.systemd_service:
    name: podman.socket
    state: started
    enabled: true
  become: true
  when: '"podman_exporter" in edpm_telemetry_enabled_exporters'

- name: Set role path for template resolution
  ansible.builtin.set_fact:
    _edpm_telemetry_role_path: "{{ role_path }}"

# The ceilometer polling agent quadlet applies the custom SELinux type
# ceilometer_polling_t, which is shipped by openstack-selinux. When that type is
# not in the loaded policy (e.g. openstack-selinux is not installed), podman/crun
# cannot transition into it and the container fails to start - regardless of
# enforcing/permissive mode. Detect the type so the option is only emitted when
# it is actually usable.
- name: Gather SELinux facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - selinux

- name: Check whether ceilometer_polling_t SELinux type is in the loaded policy
  ansible.builtin.command:
    cmd: >-
      python3 -c "import selinux, sys;
      sys.exit(0 if selinux.security_check_context('system_u:system_r:ceilometer_polling_t:s0') == 0 else 1)"
  register: _ceilometer_polling_type_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.selinux is defined
    - ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Decide whether ceilometer_polling_t confinement applies
  ansible.builtin.set_fact:
    edpm_telemetry_ceilometer_polling_type_available: >-
      {{ (ansible_facts.selinux.status | default('disabled') == 'enabled')
         and ((_ceilometer_polling_type_check.rc | default(1)) == 0) }}

- name: Deploy enabled exporters
  ansible.builtin.include_tasks:
    file: exporter.yml
  loop: "{{ edpm_telemetry_enabled_exporters }}"
  loop_control:
    loop_var: exporter

- name: List deployed health check scripts
  ansible.builtin.find:
    paths: /var/lib/openstack/healthchecks/
    file_type: directory
  register: deployed_hc
  become: true

- name: Correct health check scripts ownership based on container user IDs
  ansible.builtin.include_tasks:
    file: chown_healthcheck.yml
  loop: "{{ deployed_hc.files }}"
  loop_control:
    loop_var: hc_script
