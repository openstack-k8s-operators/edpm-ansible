- name: Configure swift user and group on the host
  ansible.builtin.import_role:
    name: edpm_users
  vars:
    edpm_users_users:
      # 42445 is matching with the uid and gid created by kolla in the swift containers
      - {"name": "swift", "uid": "42445", "gid": "42445", "shell": "/bin/sh", "comment": "swift user"}
    edpm_users_extra_dirs: []
  tags:
    - edpm_users

- name: Gather user fact
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "user"
  when:
    - ansible_user is undefined

- name: Create container config dirs
  tags:
    - configure
    - swift
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "directory"
    setype: "container_file_t"
    owner: "{{ item.owner | default(ansible_user) | default(ansible_user_id) }}"
    group: "{{ item.group | default(ansible_user) | default(ansible_user_id) }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - {"path": "{{ edpm_swift_config_dest }}", "mode": "0755"}

- name: Create persistent config dirs
  tags:
    - configure
    - swift
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "directory"
    setype: "container_file_t"
    owner: "{{ item.owner | default(ansible_user) | default(ansible_user_id) }}"
    group: "{{ item.group | default(ansible_user) | default(ansible_user_id) }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - {"path": "/srv/node", "mode": "0750", "owner": "swift", "group": "swift"}
    - {"path": "/var/cache/swift", "mode": "0700", "owner": "swift", "group": "swift"}

- name: Discover configmaps in {{ edpm_swift_config_src }}
  ansible.builtin.find:
    paths: "{{ edpm_swift_config_src }}"
    file_type: file
    recurse: true
  register: edpm_swift_configmaps
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  tags:
    - swiftrings

- name: Flatten configmaps into {{ edpm_swift_config_dest }}
  tags:
    - configure
    - swift
    - swiftrings
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ edpm_swift_config_dest }}/{{ item.path | basename }}"
    setype: "container_file_t"
    mode: "0644"
  loop: "{{ edpm_swift_configmaps.files }}"

- name: Extract swiftrings.tar.gz
  become: true
  tags:
    - install
    - swift
    - swiftrings
  ansible.builtin.unarchive:
    src: "{{ edpm_swift_config_dest }}/swiftrings.tar.gz"
    dest: "{{ edpm_swift_config_dest }}/"
    remote_src: true
  notify:
    - Restart swift

- name: Discover swift ring files
  become: true
  ansible.builtin.find:
    paths: "{{ edpm_swift_config_dest }}"
    patterns: "*.ring.gz"
    file_type: file
  register: _edpm_swift_rings
  changed_when: false

- name: Build swift ring volume mounts
  ansible.builtin.set_fact:
    edpm_swift_ring_volumes: "{{
      _edpm_swift_rings.files
      | map(attribute='path')
      | map('regex_replace', '^.*/([^/]+)$', '\\g<0>:/etc/swift/\\1:ro')
      | list
    }}"

- name: Discover swift service config files
  become: true
  ansible.builtin.find:
    paths: "{{ edpm_swift_config_dest }}"
    patterns: "*.conf"
    file_type: file
  register: _edpm_swift_confs
  changed_when: false

- name: Build swift service config volume mounts
  vars:
    _conf_specs:
      - fact: edpm_swift_account_conf_volumes
        match: account-server
        dest_dir: /etc/swift/account-server.conf.d
      - fact: edpm_swift_container_conf_volumes
        match: container-server
        dest_dir: /etc/swift/container-server.conf.d
      - fact: edpm_swift_object_expirer_conf_volumes
        match: object-expirer
        dest_dir: /etc/swift/object-expirer.conf.d
      - fact: edpm_swift_object_conf_volumes
        match: object-server
        dest_dir: /etc/swift/object-server.conf.d
    _matched: "{{
      _edpm_swift_confs.files
      | map(attribute='path')
      | select('search', item.match ~ '[^/]*\\.conf$')
      | list
    }}"
  ansible.builtin.set_fact:
    "{{ item.fact }}": "{{
      _matched
      | zip(_matched | map('basename') | map('regex_replace', '^(.*)$', item.dest_dir ~ '/\\1:ro'))
      | map('join', ':')
      | list
    }}"
  loop: "{{ _conf_specs }}"
