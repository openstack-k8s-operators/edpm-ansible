name: Run Molecule tests

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - '.github/**'
    - 'roles/**'
    - 'plugins/**'
    - 'molecule-requirements.txt'
    - 'requirements.yml'
    - 'molecule/**'
  workflow_dispatch:
jobs:
  run_molecule:
    strategy:
      fail-fast: false
      matrix:
        tested_role:
        - edpm_ceph_client_files
        - edpm_ceph_hci_pre
        - edpm_container_manage
        - edpm_cyborg
        - edpm_container_rm
        - edpm_container_standalone
        - edpm_ddp_package
        - edpm_derive_pci_device_spec
        - edpm_download_cache
        - edpm_growvols
        - edpm_instanceha_monitoring
        - edpm_network_config
        - edpm_neutron_dhcp
        - edpm_neutron_metadata
        - edpm_neutron_sriov
        - edpm_nftables
        - edpm_nodes_validation
        - edpm_ovn
        - edpm_reboot
        - edpm_swift
        - edpm_sshd
        - edpm_ssh_known_hosts
        - edpm_timezone
        - edpm_telemetry
        - edpm_telemetry_logging
        - edpm_users
        - env_data
        - edpm_pre_adoption_validation

    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - name: Check whether the role or the molecule harness is modified
      id: check_role
      run: |
        git fetch origin $GITHUB_BASE_REF
        harness='^(\.github/|molecule/|plugins/|molecule-requirements\.txt$|requirements\.yml$)'
        if grep -qE "$harness" <<<"$(git diff --name-only origin/$GITHUB_BASE_REF)"; then
          echo "modified=true" >> $GITHUB_OUTPUT
        elif grep -q "${{ matrix.tested_role }}/" <<<"$(git diff --name-only origin/$GITHUB_BASE_REF roles)"; then
          echo "modified=true" >> $GITHUB_OUTPUT
        else
          echo "modified=false" >> $GITHUB_OUTPUT
        fi
    - name: Install ansible
      if: steps.check_role.outputs.modified == 'true'
      run: pip install ansible
    - name: Install collections
      if: steps.check_role.outputs.modified == 'true'
      run: ansible-galaxy collection install --force -r requirements.yml
    - name: Install molecule deps
      if: steps.check_role.outputs.modified == 'true'
      run: pip install -r molecule-requirements.txt
    - name: Unload host AppArmor profiles that reach into the instances
      if: steps.check_role.outputs.modified == 'true'
      # Rootless podman cannot choose an AppArmor profile, so the host unix-chkpwd and rsyslogd
      # profiles get attached to instance processes on ubuntu-24.04:
      # https://bugs.launchpad.net/apparmor/+bug/2067900
      run: |
        set -e
        for name in unix-chkpwd rsyslogd; do
          for path in $(compgen -G "/etc/apparmor.d/$name" || compgen -G "/etc/apparmor.d/*$name*"); do
            sudo apparmor_parser -R "$path" || true
            sudo rm -f "$path"
          done
        done
        if sudo grep -qwE 'unix-chkpwd|rsyslogd' /sys/kernel/security/apparmor/profiles; then
          echo '::error::target apparmor profile is still loaded, refusing to run molecule'
          exit 1
        fi
    - name: Run molecule test
      if: steps.check_role.outputs.modified == 'true'
      run: |
        cd $GITHUB_WORKSPACE/roles/${{ matrix.tested_role }}
        molecule test --all
      env:
        PY_COLORS: '1'
        ANSIBLE_FORCE_COLOR: '1'
        ANSIBLE_VERBOSITY: 4
        ANSIBLE_CALLBACKS_ENABLED: profile_tasks
